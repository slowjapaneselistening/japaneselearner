<!DOCTYPE html>
<html lang="ja">
<head>
    <!-- Google Analytics -->
    <script async src="https://www.googletagmanager.com/gtag/js?id=G-F2B0GEY45P"></script>
    <script>
      window.dataLayer = window.dataLayer || [];
      function gtag(){dataLayer.push(arguments);}
      gtag('js', new Date());
      gtag('config', 'G-F2B0GEY45P');
    </script>
    
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>日本語 Learning Portal</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Noto+Sans+JP:wght@400;500;700&display=swap');
        body { font-family: 'Inter', 'Noto Sans JP', sans-serif; }
        
        .fade-in {
            animation: fadeIn 0.4s ease-out forwards;
            opacity: 0;
            transform: translateY(10px);
        }
        @keyframes fadeIn {
            to { opacity: 1; transform: translateY(0); }
        }

        .thumb-wrapper {
            position: relative;
            width: 100%;
            padding-top: 56.25%; /* 16:9 Aspect Ratio */
            background-color: #0f172a;
            overflow: hidden;
        }
        
        .thumb-wrapper img {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            object-fit: cover;
            transition: transform 0.3s ease;
        }

        .card:hover .thumb-wrapper img {
            transform: scale(1.05);
        }

        .play-overlay {
            position: absolute;
            inset: 0;
            background: rgba(0, 0, 0, 0.25);
            display: flex;
            align-items: center;
            justify-content: center;
            opacity: 0;
            transition: opacity 0.2s ease;
        }

        .card:hover .play-overlay {
            opacity: 1;
        }

        .play-icon {
            width: 48px;
            height: 48px;
            background-color: #2563eb;
            color: white;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.1rem;
            padding-left: 3px;
            box-shadow: 0 4px 12px rgba(37, 99, 235, 0.4);
            transform: scale(0.9);
            transition: transform 0.2s ease;
        }

        .card:hover .play-icon {
            transform: scale(1);
        }
    </style>
</head>
<body class="bg-gray-50 text-gray-800 min-h-screen flex flex-col">

    <!-- ヘッダー（既存教材ページとデザイン統一） -->
    <header class="bg-white shadow-sm sticky top-0 z-50">
        <div class="max-w-7xl mx-auto px-4 py-4 flex items-center justify-between">
            <div class="flex items-center gap-3">
                <div class="w-10 h-10 bg-blue-600 rounded-xl flex items-center justify-center text-white shadow-md">
                    <i class="fa-solid fa-language text-xl"></i>
                </div>
                <div>
                    <h1 class="text-xl font-bold text-gray-900 tracking-tight">日本語 Learning</h1>
                    <p class="text-xs text-gray-500 font-medium">リスニング＆会話学習ポータル</p>
                </div>
            </div>
        </div>
    </header>

    <!-- メインコンテンツエリア -->
    <main class="max-w-7xl mx-auto px-4 py-8 flex-1 w-full">
        <div class="flex items-center justify-between mb-6">
            <h2 class="text-lg font-bold text-gray-900 flex items-center gap-2">
                <i class="fa-solid fa-layer-group text-blue-600"></i> レッスン一覧
            </h2>
            <span id="lesson-count" class="text-xs font-semibold bg-blue-50 text-blue-700 px-3 py-1 rounded-full border border-blue-100">
                読み込み中...
            </span>
        </div>

        <!-- レッスンカード一覧グリッド -->
        <div id="lessons-grid" class="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-3 lg:grid-cols-4 gap-6">
            <!-- JavaScriptで自動挿入されます -->
        </div>

        <!-- 読み込み中スピナー -->
        <div id="loading-spinner" class="flex flex-col items-center justify-center py-16 gap-3">
            <i class="fa-solid fa-circle-notch fa-spin text-3xl text-blue-600"></i>
            <p class="text-sm text-gray-500 font-medium">教材データを読み込んでいます...</p>
        </div>
    </main>

    <!-- フッター -->
    <footer class="bg-white border-t border-gray-200 py-6 text-center text-xs text-gray-500 mt-auto">
        <p>© 日本語 Learning - All rights reserved.</p>
    </footer>

    <script>
        /**
         * 各教材フォルダのパス一覧を定義
         * 新しい動画/教材を追加した際は、配列の【先頭】にフォルダパスを追加してください。
         */
        const LESSON_FOLDERS = [
            'n4grammar',
            // 今後追加するフォルダをここに追加:
            // 'n4grammar_002',
        ];

        async function fetchLessonData(folderPath) {
            try {
                // 1. 各フォルダの index.html を読み込み
                const htmlRes = await fetch(`./${folderPath}/index.html`);
                if (!htmlRes.ok) return null;
                const htmlText = await htmlRes.text();

                // 2. YOUTUBE_VIDEO_ID の自動抽出
                const ytMatch = htmlText.match(/YOUTUBE_VIDEO_ID\s*=\s*['"]([^'"]+)['"]/);
                const youtubeId = ytMatch ? ytMatch[1] : null;

                // 3. タイトルの取得 (sub_en.srt の Scene 1 タイトルを優先取得)
                let title = folderPath;
                try {
                    const srtRes = await fetch(`./${folderPath}/translations/sub_en.srt`);
                    if (srtRes.ok) {
                        const srtText = await srtRes.text();
                        const sceneMatch = srtText.match(/Scene\s+\d+:\s*(.+)/i);
                        if (sceneMatch) {
                            title = sceneMatch[0].trim();
                        }
                    }
                } catch (e) {
                    console.log(`SRT load failed for ${folderPath}`);
                }

                return {
                    folderPath,
                    title,
                    youtubeId,
                    link: `./${folderPath}/index.html`
                };
            } catch (err) {
                console.error(`Error loading ${folderPath}:`, err);
                return null;
            }
        }

        async function renderPortal() {
            const grid = document.getElementById('lessons-grid');
            const spinner = document.getElementById('loading-spinner');
            const countTag = document.getElementById('lesson-count');

            const lessonPromises = LESSON_FOLDERS.map(folder => fetchLessonData(folder));
            const results = await Promise.all(lessonPromises);
            const validLessons = results.filter(item => item !== null);

            spinner.style.display = 'none';
            countTag.textContent = `${validLessons.length} 件`;

            if (validLessons.length === 0) {
                grid.innerHTML = `<div class="col-span-full text-center py-12 text-gray-500">教材が見つかりませんでした。</div>`;
                return;
            }

            validLessons.forEach((lesson, index) => {
                const thumbUrl = lesson.youtubeId 
                    ? `https://img.youtube.com/vi/${lesson.youtubeId}/hqdefault.jpg`
                    : 'https://via.placeholder.com/640x360?text=Japanese+Learning';

                const cardHtml = `
                    <a href="${lesson.link}" class="card group bg-white rounded-2xl border border-gray-100 shadow-sm hover:shadow-md transition-all duration-300 flex flex-col overflow-hidden fade-in" style="animation-delay: ${index * 0.05}s">
                        <div class="thumb-wrapper">
                            <img src="${thumbUrl}" alt="${lesson.title}" loading="lazy">
                            <div class="play-overlay">
                                <div class="play-icon">
                                    <i class="fa-solid fa-play"></i>
                                </div>
                            </div>
                        </div>
                        <div class="p-4 flex flex-col justify-between flex-1 gap-3">
                            <h3 class="font-bold text-gray-900 text-sm sm:text-base leading-snug line-clamp-2 group-hover:text-blue-600 transition-colors">
                                ${lesson.title}
                            </h3>
                            <div class="flex items-center justify-between pt-3 border-t border-gray-100 text-xs font-semibold text-blue-600">
                                <span>学習をはじめる</span>
                                <i class="fa-solid fa-arrow-right transition-transform group-hover:translate-x-1"></i>
                            </div>
                        </div>
                    </a>
                `;
                grid.insertAdjacentHTML('beforeend', cardHtml);
            });
        }

        window.addEventListener('DOMContentLoaded', renderPortal);
    </script>
</body>
</html>
