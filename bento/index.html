            transition: all 0.3s ease-out;
            white-space: nowrap;
            z-index: 10;

                            romaji: item.exampleRomaji || "",
                            audioPath: correctedAudio
                        };
                    });
                    scenes.push({ lines: lines });
                } catch (e) {
                    console.error(`Error loading scene ${i}:`, e);
                    scenes.push({ lines: [] });
                }
            }
            await updateTranslations();
        }

        // 時間文字列 (00:00:13,008) を秒数 (13.008) に変換するヘルパー
        function srtTimeToSeconds(timeStr) {
            if (!timeStr) return 0;
            const parts = timeStr.replace(',', '.').split(':');
            return parseFloat(parts[0]) * 3600 + parseFloat(parts[1]) * 60 + parseFloat(parts[2]);
        }

        async function loadSRT(langCode) {
            if (srtDataCache[langCode]) return srtDataCache[langCode];
            try {
                const response = await fetch(`translations/sub_${langCode}.srt`);
                if (!response.ok) return null;
                const text = await response.text();
                const blocks = text.trim().split(/\r?\n\r?\n/);
                
                // 各ブロックから時間情報とテキストを抽出してオブジェクトの配列にする
                const srtParsed = blocks.map(block => {
                    const lines = block.split(/\r?\n/);
                    if (lines.length < 3) return { text: '', start: 0, end: 0 };
                    
                    // 2行目のタイムスタンプ行をパース (00:00:00,000 --> 00:00:10,008)
                    const timeMatch = lines[1].match(/(\d{2}:\d{2}:\d{2}[,\.]\d{3})\s*-->\s*(\d{2}:\d{2}:\d{2}[,\.]\d{3})/);
                    const start = timeMatch ? srtTimeToSeconds(timeMatch[1]) : 0;
                    const end = timeMatch ? srtTimeToSeconds(timeMatch[2]) : 0;
                    const textContent = lines.slice(2).join('\n').trim();
                    
                    return { text: textContent, start: start, end: end };
                });
                
                srtDataCache[langCode] = srtParsed;
                return srtParsed;
            } catch (e) {
                console.error(`Error loading SRT for ${langCode}:`, e);
                return null;
            }
        }

        async function updateTranslations() {
            const langCode = appState.currentLang;
            const srtParsed = await loadSRT(langCode);
            if (!srtParsed || srtParsed.length === 0) return;

            let globalIdx = 1;
            scenes.forEach((scene, index) => {
                if (index <= 2) {
                    globalIdx += 2;
                } else {
                    globalIdx++;
                }
                
                scene.lines.forEach(line => {
                    if (globalIdx < srtParsed.length) {
                        const srtItem = srtParsed[globalIdx];
                        line.english = srtItem.text || "Translation not available.";
                        line.startTime = srtItem.start; // 開始秒数を移植
                        line.endTime = srtItem.end;     // 終了秒数を移植
                    } else {
                        line.startTime = 0;
                        line.endTime = 0;
                    }
                    globalIdx++;
                });
            });
        }

        function generateRomaji(text) {
            // Simple mapping for demonstration purposes
            const map = {
                'こんにちは':'konnichiwa', 'おはよう':'ohayou', 'ありがとう':'arigatou',
                'はい':'hai', 'いいえ':'iie', 'すみません':'sumimasen'
            };
            let romaji = text;
            for (let k in map) {
                romaji = romaji.replace(new RegExp(k, 'g'), map[k]);
            }
            return romaji || "Romaji not fully generated";
        }

        function formatJapanese(rawJp, hideFurigana) {
            // 正規表現を修正し、漢字（と「々」）の直後にあるカッコのみを「ふりがな」として処理します
            return rawJp.replace(/([\u4E00-\u9FFF\u3005]+)\((.*?)\)/g, (match, kanji, ruby) => {
                if (hideFurigana) {
                    return `<span class="kanji-hidden" onclick="revealFurigana(this)"><span class="kanji-text">${kanji}</span><span class="kanji-revealed">${ruby}</span></span>`;
                } else {
                    return `<ruby>${kanji}<rt>${ruby}</rt></ruby>`;
                }
            });
        }

        window.revealFurigana = function(element) {
            element.classList.toggle('show-ruby');
        };

        let currentAudio = null;

        function playAudio(audioPath) {
            if (currentAudio) {
                currentAudio.pause();
            }
            if (!audioPath) return;
            currentAudio = new Audio(audioPath);
            currentAudio.playbackRate = 0.85;
            currentAudio.play().catch(e => console.error("Audio play failed:", e));

        async function playEntireScene() {
            const playBtnIcon = document.querySelector('#play-scene-btn i');

            if (appState.isPlaying) {
                if (currentAudio) currentAudio.pause();
                appState.isPlaying = false;
                playBtnIcon.className = 'fa-solid fa-play';
                document.querySelectorAll('.message-bubble').forEach(b => b.classList.remove('ring-2', 'ring-blue-400', 'ring-purple-400'));
                return;
            }

            appState.isPlaying = true;
            playBtnIcon.className = 'fa-solid fa-stop';
            const scene = scenes[appState.currentSceneIndex];
            
            for (let i = 0; i < scene.lines.length; i++) {
                if (!appState.isPlaying) break; 
                
                const line = scene.lines[i];
                const isMuted = appState.roleplayMutedSpeaker === line.speaker;

                const allMessageBubbles = document.querySelectorAll('.message-bubble');
                if (allMessageBubbles[i]) {
                    allMessageBubbles.forEach(b => b.classList.remove('ring-2', 'ring-blue-400', 'ring-purple-400'));
                    allMessageBubbles[i].classList.add('ring-2', isMuted ? 'ring-purple-400' : 'ring-blue-400');
                    allMessageBubbles[i].scrollIntoView({ behavior: 'smooth', block: 'center' });
                }
                
                if (isMuted) {
                    const waitTime = 1500 + (line.speakText.length * 150);
                    await new Promise(r => setTimeout(r, waitTime));
                } else {
                    if (line.audioPath) {
                        await new Promise(resolve => {
                            if (currentAudio) currentAudio.pause();
                            currentAudio = new Audio(line.audioPath);
                            currentAudio.playbackRate = 0.85;
                            currentAudio.onended = resolve;
                            currentAudio.onerror = resolve;
                            currentAudio.play().catch(e => {
                                console.error("Audio play failed in loop:", e);
                                resolve();
                            });
                        });
                    } else {
                        await new Promise(r => setTimeout(r, 1000));
                    }
                }
                
                await new Promise(r => setTimeout(r, 600));
            }

            if (appState.isPlaying) {
                document.querySelectorAll('.message-bubble').forEach(b => b.classList.remove('ring-2', 'ring-blue-400', 'ring-purple-400'));
            }

            appState.isPlaying = false;
            playBtnIcon.className = 'fa-solid fa-play';
        }

        function loadQuestion() {
            appState.isAnswering = false;
            const qData = quizData[appState.currentQuestionIndex];
            
            document.getElementById('quiz-progress').innerText = `Question ${appState.currentQuestionIndex + 1} / ${quizData.length}`;
            document.getElementById('quiz-score').innerText = `Score: ${appState.score}`;
            document.getElementById('quiz-question').innerHTML = qData.q;
            
            const optionsContainer = document.getElementById('quiz-options');
            optionsContainer.innerHTML = '';
            
            // 選択肢のインデックスを保持したままシャッフル
            const shuffledOptions = qData.options.map((opt, idx) => ({ text: opt, originalIndex: idx }));
            for (let i = shuffledOptions.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [shuffledOptions[i], shuffledOptions[j]] = [shuffledOptions[j], shuffledOptions[i]];
            }
            
            shuffledOptions.forEach((opt) => {
                const btn = document.createElement('button');
                btn.className = "w-full bg-white border-2 border-gray-200 hover:border-blue-500 hover:bg-blue-50 text-gray-700 font-bold py-4 px-6 rounded-xl text-lg sm:text-xl transition-all shadow-sm text-left sm:text-center";
                btn.innerHTML = opt.text;
                btn.dataset.originalIndex = opt.originalIndex;
                btn.onclick = () => checkAnswer(opt.originalIndex, btn);
                optionsContainer.appendChild(btn);
            });
        }

        function checkAnswer(selectedIndex, btnElement) {
            if (appState.isAnswering) return;
            appState.isAnswering = true;
            
            const correctIndex = quizData[appState.currentQuestionIndex].answer;
            const isCorrect = selectedIndex === correctIndex;
            
            if (isCorrect) {
                appState.score++;
                btnElement.classList.remove('border-gray-200', 'hover:border-blue-500', 'hover:bg-blue-50', 'text-gray-700');
                btnElement.classList.add('bg-green-500', 'text-white', 'border-green-500');
            } else {
                btnElement.classList.remove('border-gray-200', 'hover:border-blue-500', 'hover:bg-blue-50', 'text-gray-700');
                btnElement.classList.add('bg-red-500', 'text-white', 'border-red-500');
                
                // シャッフル後の配置に対応した正解のハイライト
                const allButtons = document.getElementById('quiz-options').children;
                for (let btn of allButtons) {
                    if (parseInt(btn.dataset.originalIndex) === correctIndex) {
                        btn.classList.remove('border-gray-200');
                        btn.classList.add('border-green-500', 'bg-green-50', 'text-green-700');
                    }
                }
            }
            
            document.getElementById('quiz-score').innerText = `Score: ${appState.score}`;
            
            setTimeout(() => {
                appState.currentQuestionIndex++;
                if (appState.currentQuestionIndex < quizData.length) {
                    loadQuestion();
                } else {
                    showResult();
                }
            }, 1200);
        }

            document.getElementById('quiz-area').classList.add('hidden');
            document.getElementById('quiz-result').classList.remove('hidden');

        // ==========================================
        // 【YouTube 設定エリア】次回からはここを変更してください
        // ==========================================
        const YOUTUBE_VIDEO_ID = 'wzhuP1ih7aU'; 
       const sceneStartTimes = [18, 212, 453, 655, 822, 1026, 1027, 1224, 1423, 1612];
        // ==========================================

        let ytPlayer = null;

        // YouTube Iframe API スクリプトを自動動的ロード
        const tag = document.createElement('script');
        tag.src = "https://www.youtube.com/iframe_api";
        const firstScriptTag = document.getElementsByTagName('script')[0];
        firstScriptTag.parentNode.insertBefore(tag, firstScriptTag);

        let ytTimeTracker = null;

        window.onYouTubeIframeAPIReady = () => {
            ytPlayer = new YT.Player('player', {
                videoId: YOUTUBE_VIDEO_ID,
                playerVars: {
                    'playsinline': 1,
                    'rel': 0
                },
                events: {
                    'onStateChange': onPlayerStateChange
                }
            });
        };

        // YouTubeの再生状態が変化した時のイベント
        function onPlayerStateChange(event) {
            // 動画再生中 (YT.PlayerState.PLAYING は 1)
            if (event.data === 1) {
                // 独自音声再生の一括ループが走っていたら停止させる
                if (appState.isPlaying) {
                    const playBtnIcon = document.querySelector('#play-scene-btn i');
                    if (playBtnIcon) playBtnIcon.className = 'fa-solid fa-play';
                    appState.isPlaying = false;
                }
                
                // 200ミリ秒ごとに再生位置をチェックするタイマーを開始
                if (!ytTimeTracker) {
                    appState.lastScrolledIndex = -1; // 再生開始時にメモ帳をリセット
                    ytTimeTracker = setInterval(trackYoutubeTime, 200);
                }
            } else {
                // 再生中以外（一時停止、終了など）はタイマーを止める
                if (ytTimeTracker) {
                    clearInterval(ytTimeTracker);
                    ytTimeTracker = null;
                }
            }
        }

        // 現在の動画再生時間に合わせてテキストをスクロール・ハイライトする関数
        function trackYoutubeTime() {
            if (!ytPlayer || typeof ytPlayer.getCurrentTime !== 'function') return;
            
            const currentTime = ytPlayer.getCurrentTime();

            // シーンの自動切り替え判定
            let detectedSceneIdx = appState.currentSceneIndex;
            for (let i = 0; i < sceneStartTimes.length; i++) {
                const start = sceneStartTimes[i];
                const end = (i + 1 < sceneStartTimes.length) ? sceneStartTimes[i + 1] : Infinity;
                if (currentTime >= start && currentTime < end) {
                    detectedSceneIdx = i;
                    break;
                }
            }
            if (detectedSceneIdx !== appState.currentSceneIndex) {
                appState.currentSceneIndex = detectedSceneIdx;
                const selector = document.getElementById('scene-selector');
                if (selector) selector.value = detectedSceneIdx;
                renderScene();
                return; // シーン切り替え時のみここで抜けて再描画する
            }

            // 【修正】シーンが変わっていない場合は、毎回の強制的なrenderSceneをスキップ
            const scene = scenes[appState.currentSceneIndex];
            if (!scene || !scene.lines) return;

            // 現在の再生時間に一致するセリフのインデックスを探す
            let activeIdx = -1;
            for (let i = 0; i < scene.lines.length; i++) {
                const line = scene.lines[i];
                if (line.startTime <= currentTime && currentTime <= line.endTime) {
                    activeIdx = i;
                    break;
                }
            }

            if (activeIdx !== -1) {
                const allMessageBubbles = document.querySelectorAll('.message-bubble');
                
                // すべてのバブルから枠線ハイライトを一旦消し、現在アクティブなものだけに付与
                allMessageBubbles.forEach((b, idx) => {
                    if (idx === activeIdx) {
                        const isMuted = appState.roleplayMutedSpeaker === scene.lines[idx].speaker;
                        b.classList.add('ring-2', isMuted ? 'ring-purple-400' : 'ring-blue-400');
                    } else {
                        b.classList.remove('ring-2', 'ring-blue-400', 'ring-purple-400');
                    }
                });

                // 【防振処理】直前にスクロールしたインデックスと異なる（＝セリフが変わった）場合のみ1回実行
                if (activeIdx !== appState.lastScrolledIndex && allMessageBubbles[activeIdx]) {
                    appState.lastScrolledIndex = activeIdx; // メモ帳を更新
                    allMessageBubbles[activeIdx].scrollIntoView({ behavior: 'smooth', block: 'center' });
                }
            } else {
                // 該当するセリフがない時間帯（シーンの合間など）はハイライトを外す
                document.querySelectorAll('.message-bubble').forEach(b => {
                    b.classList.remove('ring-2', 'ring-blue-400', 'ring-purple-400');
                });
            }
        }

                renderScene();
            });

            document.getElementById('roleplay-selector').addEventListener('change', (e) => {
                appState.roleplayMutedSpeaker = e.target.value;
                renderScene();
            });

            document.getElementById('tab-btn-conv').addEventListener('click', () => switchTab('conv'));
            document.getElementById('tab-btn-quiz').addEventListener('click', () => switchTab('quiz'));

            renderScene();
        };
        // 携帯（iOS/Android）のオーディオ制限を解除するおまじない
        function initAudioContext() {
            if (window.AudioContext || window.webkitAudioContext) {
                const AudioContext = window.AudioContext || window.webkitAudioContext;
                const ctx = new AudioContext();
                if (ctx.state === 'suspended') {
                    ctx.resume();
                }
            }
        }

        // 個別セリフの録音・停止の切り替え
        async function toggleRecording(index, btnElement) {
            initAudioContext();
            const key = appState.currentSceneIndex + '_' + index;
            const icon = btnElement.querySelector('i');

            // 録音中の停止処理
            if (appState.activeRecordingIndex === index) {
                if (appState.mediaRecorder && appState.mediaRecorder.state !== 'inactive') {
                    appState.mediaRecorder.stop();
                }
                return;
            }

            // 他の場所が録音中なら無視
            if (appState.activeRecordingIndex !== -1) return;

            try {
                const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
                const chunks = [];
                appState.mediaRecorder = new MediaRecorder(stream, { mimeType: 'audio/webm' });
                
                appState.mediaRecorder.ondataavailable = e => {
                    if (e.data.size > 0) chunks.push(e.data);
                };

                appState.mediaRecorder.onstop = () => {
                    const blob = new Blob(chunks, { type: 'audio/webm' });
                    appState.recordedBlobs[key] = URL.createObjectURL(blob);
                    
                    // 録音完了後にUIを元に戻し、自分の声再生ボタンを出現させる
                    appState.activeRecordingIndex = -1;
                    icon.className = 'fa-solid fa-microphone';
                    btnElement.classList.remove('bg-red-500', 'text-white', 'animate-pulse');
                    btnElement.classList.add('bg-gray-100', 'text-gray-400');
                    
                    const myPlayBtn = document.getElementById(`my-audio-btn-${index}`);
                    if (myPlayBtn) myPlayBtn.classList.remove('hidden');
                    
                    // マイクストリームを終了（スマホの録音中マークを消す）
                    stream.getTracks().forEach(track => track.stop());
                };

                // 録音開始
                appState.activeRecordingIndex = index;
                icon.className = 'fa-solid fa-square';
                btnElement.classList.remove('bg-gray-100', 'text-gray-400');
                btnElement.classList.add('bg-red-500', 'text-white', 'animate-pulse');
                
                appState.mediaRecorder.start();

            } catch (err) {
                console.error("マイクの起動に失敗しました。HTTPS接続であることを確認してください:", err);
                alert("マイク機能を利用できません。通信が暗号化(HTTPS)されているか確認してください。");
            }
        }

        // 個別に録音した自分の声を再生
        function playMyAudio(index) {
            initAudioContext();
            const key = appState.currentSceneIndex + '_' + index;
            const audioUrl = appState.recordedBlobs[key];
            if (!audioUrl) return;

            if (currentAudio) currentAudio.pause();
            currentAudio = new Audio(audioUrl);
            currentAudio.play().catch(e => console.error("録音再生失敗:", e));
        }

        // ★ご要望機能：自分の録音がある箇所は差し替え、ない箇所はお手本で「すべて通して聴く」
        async function playMixedScene() {
            initAudioContext();
            const mixBtn = document.getElementById('play-mix-btn');
            const mixBtnIcon = mixBtn.querySelector('i');

            if (appState.isPlaying) {
                if (currentAudio) currentAudio.pause();
                appState.isPlaying = false;
                mixBtnIcon.className = 'fa-solid fa-shuffle';
                document.querySelectorAll('.message-bubble').forEach(b => b.classList.remove('ring-2', 'ring-blue-400', 'ring-purple-400'));
                return;
            }

            appState.isPlaying = true;
            mixBtnIcon.className = 'fa-solid fa-stop';
            const scene = scenes[appState.currentSceneIndex];
            
            for (let i = 0; i < scene.lines.length; i++) {
                if (!appState.isPlaying) break; 
                
                const line = scene.lines[i];
                const key = appState.currentSceneIndex + '_' + i;
                const myAudioUrl = appState.recordedBlobs[key]; // 自分の録音があるか確認

                // 画面スクロールとハイライト連動
                const allMessageBubbles = document.querySelectorAll('.message-bubble');
                if (allMessageBubbles[i]) {
                    allMessageBubbles.forEach(b => b.classList.remove('ring-2', 'ring-blue-400', 'ring-purple-400'));
                    allMessageBubbles[i].classList.add('ring-2', myAudioUrl ? 'ring-orange-400' : 'ring-blue-400');
                    allMessageBubbles[i].scrollIntoView({ behavior: 'smooth', block: 'center' });
                }
                
                // 再生ソースの決定（自分の録音があればそれを、なければお手本を流す）
                const activeAudioSrc = myAudioUrl ? myAudioUrl : line.audioPath;

                if (activeAudioSrc) {
                    await new Promise(resolve => {
                        if (currentAudio) currentAudio.pause();
                        currentAudio = new Audio(activeAudioSrc);
                        
                        // 自分の声の時は等倍速、お手本は既存通り0.85倍速
                        currentAudio.playbackRate = myAudioUrl ? 1.0 : 0.85;
                        
                        currentAudio.onended = resolve;
                        currentAudio.onerror = resolve;
                        currentAudio.play().catch(e => {
                            console.error("通し再生中に音声エラー:", e);
                            resolve();
                        });
                    });
                } else {
                    // 音声データがないセリフは1秒待機
                    await new Promise(r => setTimeout(r, 1000));
                }
                
                // セリフの間の余韻時間
                await new Promise(r => setTimeout(r, 600));
            }

            // 終了処理
            document.querySelectorAll('.message-bubble').forEach(b => b.classList.remove('ring-2', 'ring-blue-400', 'ring-purple-400'));
            appState.isPlaying = false;
            mixBtnIcon.className = 'fa-solid fa-shuffle';
        }
    </script>
</body>
