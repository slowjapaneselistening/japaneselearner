        .fade-in {
            animation: fadeIn 0.35s ease-out forwards;
            opacity: 0;
            transform: translateY(8px);
        }
        @keyframes fadeIn {
            to { opacity: 1; transform: translateY(0); }
        }

        .speaker-1-bg { background-color: #ffffff; }
        .speaker-2-bg { background-color: #f0fdf4; }

        .kanji-hidden {
            display: inline-block;
            background-color: #fef08a;
            border-bottom: 2px dashed #ca8a04;
            border-radius: 4px;
            padding: 0 4px;
            cursor: pointer;
            transition: all 0.2s;
            position: relative;
        }
        .kanji-hidden:hover { background-color: #fde047; }
        .kanji-revealed {
            position: absolute;
            bottom: 100%;
            left: 50%;
            transform: translateX(-50%) translateY(5px);
            background-color: #1e40af;
            color: white;
            padding: 2px 6px;
            border-radius: 4px;
            font-size: 0.75rem;
            font-weight: bold;
            opacity: 0;
            pointer-events: none;
            transition: all 0.3s ease-out;
            white-space: nowrap;
            z-index: 10;
        }
        .kanji-hidden.show-ruby .kanji-revealed {
            opacity: 1;
            transform: translateX(-50%) translateY(-2px);

        // =========================================================
        // ★ 結合MP3 セグメント再生エンジン（1本のMP3からセリフ区間を切り出し再生）
        // =========================================================
        let masterAudioEl = null;
        let currentCustomAudio = null;
        let activeSegmentAbort = null;

        function ensureMasterAudio(streamUrl) {
            if (!streamUrl) return null;
            if (!masterAudioEl) {
                masterAudioEl = new Audio();
                masterAudioEl.preload = 'auto';
            }
            if (masterAudioEl.dataset.srcUrl !== streamUrl) {
                masterAudioEl.pause();
                masterAudioEl.src = streamUrl;
                masterAudioEl.dataset.srcUrl = streamUrl;
                masterAudioEl.load();
            }
            return masterAudioEl;
        }

        function stopAllPlayback() {
            if (activeSegmentAbort) {
                activeSegmentAbort();
                activeSegmentAbort = null;
            }
            if (masterAudioEl) masterAudioEl.pause();
            if (currentCustomAudio) currentCustomAudio.pause();
        }

        function playMp3Segment(startSec, endSec, rate = 0.85) {
            return new Promise((resolve) => {
                stopAllPlayback();
                const url = portalState.currentMp3StreamUrl;
                const dur = Math.max(0, (endSec || 0) - (startSec || 0));
                if (!url || dur <= 0.05) {
                    resolve();
                    return;
                }

                const audio = ensureMasterAudio(url);
                let finished = false;
                let timerId = null;

                const cleanup = () => {
                    if (finished) return;
                    finished = true;
                    if (timerId) clearInterval(timerId);
                    audio.removeEventListener('ended', onEnded);
                    audio.removeEventListener('error', onError);
                    activeSegmentAbort = null;
                    resolve();
                };

                const onEnded = () => cleanup();
                const onError = () => cleanup();

                activeSegmentAbort = () => {
                    audio.pause();
                    cleanup();
                };

                const startPlay = () => {
                    try {
                        audio.playbackRate = rate;
                        audio.currentTime = Math.max(0, startSec - 0.03);
                        audio.addEventListener('ended', onEnded);
                        audio.addEventListener('error', onError);

                        const p = audio.play();
                        if (p && typeof p.catch === 'function') {
                            p.catch(() => cleanup());
                        }

                        timerId = setInterval(() => {
                            if (finished) return;
                            if (audio.currentTime >= endSec + 0.04) {
                                audio.pause();
                                cleanup();
                            }
                        }, 30);
                    } catch (e) {
                        cleanup();
                    }
                };

                if (audio.readyState >= 1) {
                    startPlay();
                } else {
                    const onMeta = () => {
                        audio.removeEventListener('loadedmetadata', onMeta);
                        startPlay();
                    };
                    audio.addEventListener('loadedmetadata', onMeta);
                }
            });
        }

        async function fetchGas(params) {
            const qs = new URLSearchParams({ ...params, key: portalState.passkey });
            const res = await fetch(`${GAS_API_URL}?${qs.toString()}`);
            if (!res.ok) throw new Error(`HTTP ${res.status}`);
            return await res.json();
        }

        async function authenticateAndLoad(passkey, forceRefresh = false) {
            portalState.passkey = passkey.trim();
            const data = await fetchGas({
                action: 'catalog',
                ...(forceRefresh ? { refresh: '1' } : {})
            });
            if (!data.ok) {
                throw new Error(data.message || 'パスコードが無効です。');
            }

            localStorage.setItem(STORAGE_KEY_NAME, portalState.passkey);
            portalState.tier = data.tier;
            portalState.catalog = data;

            document.getElementById('auth-screen').classList.add('hidden');
            document.getElementById('portal-shell').classList.remove('hidden');

        function formatBytes(bytes) {
            if (!bytes) return '';
            const mb = bytes / (1024 * 1024);
            return mb >= 1 ? `${mb.toFixed(1)} MB` : `${Math.round(bytes / 1024)} KB`;
        }

        function populateMediaLangFilter(selectId, items) {
            const sel = document.getElementById(selectId);
            if (!sel) return;
            const prev = sel.value || 'ALL';
            const langs = new Set();
            (items || []).forEach(it => {
                if (it.type === 'bundle' && Array.isArray(it.files)) {
                    it.files.forEach(f => { if (f.lang) langs.add(f.lang); });
                }
            });
            sel.innerHTML = `<option value="ALL">${escapeHtml(t('allLangs'))}</option>`;
            Array.from(langs).sort().forEach(l => {
                const opt = document.createElement('option');
                opt.value = l;
                opt.text = l;
                sel.appendChild(opt);
            });
            sel.value = (prev === 'ALL' || langs.has(prev)) ? prev : 'ALL';
        }

        function srtTimeToSeconds(timeStr) {
            if (!timeStr) return 0;
            const parts = timeStr.replace(',', '.').split(':');
            return parseFloat(parts[0]) * 3600 + parseFloat(parts[1]) * 60 + parseFloat(parts[2]);
        }

        async function loadSRT(langCode) {
            const vid = portalState.currentVideoId;
            if (!vid) return null;
            const cacheKey = `${vid}_${langCode}`;
            if (portalState.srtCache[cacheKey]) return portalState.srtCache[cacheKey];

            try {
                const res = await fetchGas({ action: 'srt', videoId: vid, lang: langCode });
                if (!res.ok || !res.srtText) return null;

                const blocks = res.srtText.trim().split(/\r?\n\r?\n/);
                const srtParsed = blocks.map(block => {
                    const lines = block.split(/\r?\n/);
                    if (lines.length < 3) return { text: '', start: 0, end: 0 };
                    const timeMatch = lines[1].match(/(\d{2}:\d{2}:\d{2}[,\.]\d{3})\s*-->\s*(\d{2}:\d{2}:\d{2}[,\.]\d{3})/);
                    const start = timeMatch ? srtTimeToSeconds(timeMatch[1]) : 0;
                    const end = timeMatch ? srtTimeToSeconds(timeMatch[2]) : 0;
                    const textContent = lines.slice(2).join('\n').trim();
                    return { text: textContent, start, end };
                });

                portalState.srtCache[cacheKey] = srtParsed;
                return srtParsed;
            } catch (e) {
                console.error(`Error loading SRT for ${langCode}:`, e);
                return null;
            }
        }

        async function updateSceneTitles() {
            const srtParsed = await loadSRT(appState.currentLang);
            if (srtParsed && srtParsed.length > 0) {
                const sceneRegex = /^Scene\s+\d+:/i;
                const detected = srtParsed.filter(item => sceneRegex.test(item.text.trim())).map(item => item.text.trim());
                if (detected.length > 0) {
                    sceneTitles = detected;
                    return;
                }
            }
            sceneTitles = scenes.map((sc, idx) => `Scene ${idx + 1}: ${sc.titleJa}`);
        }

        async function updateSceneStartTimes() {
            const srtParsed = await loadSRT(appState.currentLang);
            if (!srtParsed || srtParsed.length === 0) {
                sceneStartTimes = [];
                return;
            }
            const sceneRegex = /^Scene\s+\d+:/i;
            sceneStartTimes = srtParsed
                .filter(item => sceneRegex.test(item.text.trim()))
                .map(item => Math.floor(item.start));
        }

        async function updateTranslations() {
            const srtParsed = await loadSRT(appState.currentLang);
            if (!srtParsed || srtParsed.length === 0) {
                scenes.forEach(sc => sc.lines.forEach(l => { l.english = l.baseEn; }));
                return;
            }

            // シーン見出しと挿入動画字幕（OP動画・PDF案内・テスト案内等）を除外して純粋なセリフブロックを抽出
            const sceneRegex = /^Scene\s+\d+:/i;
            const nonLineRegex = /(listening test|answer subtitles|PDFスクリプト|トップコメント|1周目は理解度テスト)/i;

            const sceneHeaderIndices = [];
            srtParsed.forEach((item, idx) => {
                if (sceneRegex.test((item.text || '').trim())) {
                    sceneHeaderIndices.push(idx);
                }
            });

            if (sceneHeaderIndices.length > 0) {
                // Scene 1 より前の OP動画字幕をすべてスキップし、シーン単位で正確に照合する
                scenes.forEach((scene, sceneIdx) => {
                    if (sceneIdx < sceneHeaderIndices.length) {
                        const sliceStart = sceneHeaderIndices[sceneIdx] + 1;
                        const sliceEnd = (sceneIdx + 1 < sceneHeaderIndices.length)
                            ? sceneHeaderIndices[sceneIdx + 1]
                            : srtParsed.length;
                        const sceneBlocks = srtParsed.slice(sliceStart, sliceEnd).filter(item => {
                            const t = (item.text || '').trim();
                            if (!t) return false;
                            if (sceneRegex.test(t)) return false;
                            if (nonLineRegex.test(t)) return false;
                            return true;
                        });

                        scene.lines.forEach((line, lineIdx) => {
                            if (lineIdx < sceneBlocks.length) {
                                const srtItem = sceneBlocks[lineIdx];
                                line.english = srtItem.text || line.baseEn;
                                line.startTime = srtItem.start;
                                line.endTime = srtItem.end;
                            } else {
                                line.startTime = 0;
                                line.endTime = 0;
                            }
                        });
                    } else {
                        scene.lines.forEach(line => {
                            line.startTime = 0;
                            line.endTime = 0;
                        });
                    }
                });
                return;
            }

            const dialogueBlocks = srtParsed.filter(item => {
                const t = item.text.trim();
                if (!t) return false;
                if (sceneRegex.test(t)) return false;
                if (nonLineRegex.test(t)) return false;
                return true;
            });

            let ptr = 0;
            scenes.forEach(scene => {
                scene.lines.forEach(line => {
                    if (ptr < dialogueBlocks.length) {
                        const srtItem = dialogueBlocks[ptr];
                        line.english = srtItem.text || line.baseEn;
                        line.startTime = srtItem.start;
                        line.endTime = srtItem.end;
                        ptr++;
                    } else {
                        line.startTime = 0;
                        line.endTime = 0;
                    }
                });
            });
        }

        function formatJapanese(rawJp, hideFurigana) {
            return String(rawJp || '').replace(/([\u4E00-\u9FFF\u3005]+)\((.*?)\)/g, (match, kanji, ruby) => {
                if (hideFurigana) {
                    return `<span class="kanji-hidden" onclick="revealFurigana(this, event)"><span class="kanji-text">${kanji}</span><span class="kanji-revealed">${ruby}</span></span>`;
                }
                return `<ruby>${kanji}<rt>${ruby}</rt></ruby>`;
            });
        }

        window.revealFurigana = function(element, event) {
            if (event) event.stopPropagation();
            element.classList.toggle('show-ruby');
        };

        function escapeHtml(str) {
            return String(str || '')
                .replace(/&/g, '&amp;')
                .replace(/</g, '&lt;')
                .replace(/>/g, '&gt;')
                .replace(/"/g, '&quot;')
                .replace(/'/g, '&#39;');
        }

            selector.value = (currentVal !== '' && Number(currentVal) < count) ? currentVal : 0;
        }

        function playLineAudio(lineIndex) {
            initAudioContext();
            const scene = scenes[appState.currentSceneIndex];
            if (!scene || !scene.lines[lineIndex]) return;
            const line = scene.lines[lineIndex];
            playMp3Segment(line.mp3Start, line.mp3End, 0.85);
        }

        function seekVideoToLine(lineIndex) {
            const scene = scenes[appState.currentSceneIndex];
            if (!scene || !scene.lines[lineIndex]) return;
            const line = scene.lines[lineIndex];
            const targetSec = (line.endTime > line.startTime)
                ? line.startTime
                : (sceneStartTimes[appState.currentSceneIndex] || 0);

            stopAllPlayback();
            appState.isPlaying = false;
            const playBtnIcon = document.querySelector('#play-scene-btn i');
            const mixBtnIcon = document.querySelector('#play-mix-btn i');
            if (playBtnIcon) playBtnIcon.className = 'fa-solid fa-play';
            if (mixBtnIcon) mixBtnIcon.className = 'fa-solid fa-shuffle';

            if (ytPlayer && typeof ytPlayer.seekTo === 'function') {
                ytPlayer.seekTo(targetSec, true);
                if (typeof ytPlayer.playVideo === 'function') {
                    ytPlayer.playVideo();
                }
            }
        }

        async function playEntireScene() {
            initAudioContext();
            const playBtnIcon = document.querySelector('#play-scene-btn i');

            if (appState.isPlaying) {
                stopAllPlayback();
                appState.isPlaying = false;
                playBtnIcon.className = 'fa-solid fa-play';
                document.querySelectorAll('.message-bubble').forEach(b => b.classList.remove('ring-2', 'ring-blue-400', 'ring-purple-400'));
                return;
            }

            appState.isPlaying = true;
            playBtnIcon.className = 'fa-solid fa-stop';
            const scene = scenes[appState.currentSceneIndex];
            if (!scene) return;

            for (let i = 0; i < scene.lines.length; i++) {
                if (!appState.isPlaying) break;
                const line = scene.lines[i];
                const isMuted = appState.roleplayMutedSpeaker === line.speaker;

                const allMessageBubbles = document.querySelectorAll('.message-bubble');
                if (allMessageBubbles[i]) {
                    allMessageBubbles.forEach(b => b.classList.remove('ring-2', 'ring-blue-400', 'ring-purple-400'));
                    allMessageBubbles[i].classList.add('ring-2', isMuted ? 'ring-purple-400' : 'ring-blue-400');
                    allMessageBubbles[i].scrollIntoView({ behavior: 'smooth', block: 'center' });
                }

                if (isMuted) {
                    const waitTime = 1500 + (line.speakText.length * 150);
                    await new Promise(r => setTimeout(r, waitTime));
                } else {
                    await playMp3Segment(line.mp3Start, line.mp3End, 0.85);
                }

                if (!appState.isPlaying) break;
                await new Promise(r => setTimeout(r, 600));
            }

            document.querySelectorAll('.message-bubble').forEach(b => b.classList.remove('ring-2', 'ring-blue-400', 'ring-purple-400'));
            appState.isPlaying = false;
            playBtnIcon.className = 'fa-solid fa-play';
        }

        async function playMixedScene() {
            initAudioContext();
            const mixBtn = document.getElementById('play-mix-btn');
            const mixBtnIcon = mixBtn.querySelector('i');

            if (appState.isPlaying) {
                stopAllPlayback();
                appState.isPlaying = false;
                mixBtnIcon.className = 'fa-solid fa-shuffle';
                document.querySelectorAll('.message-bubble').forEach(b => b.classList.remove('ring-2', 'ring-blue-400', 'ring-purple-400', 'ring-orange-400'));
                return;
            }

            appState.isPlaying = true;
            mixBtnIcon.className = 'fa-solid fa-stop';
            const scene = scenes[appState.currentSceneIndex];
            if (!scene) return;

            for (let i = 0; i < scene.lines.length; i++) {
                if (!appState.isPlaying) break;
                const line = scene.lines[i];
                const key = appState.currentSceneIndex + '_' + i;
                const myAudioUrl = appState.recordedBlobs[key];

                const allMessageBubbles = document.querySelectorAll('.message-bubble');
                if (allMessageBubbles[i]) {
                    allMessageBubbles.forEach(b => b.classList.remove('ring-2', 'ring-blue-400', 'ring-purple-400', 'ring-orange-400'));
                    allMessageBubbles[i].classList.add('ring-2', myAudioUrl ? 'ring-orange-400' : 'ring-blue-400');
                    allMessageBubbles[i].scrollIntoView({ behavior: 'smooth', block: 'center' });
                }

                if (myAudioUrl) {
                    await new Promise(resolve => {
                        stopAllPlayback();
                        currentCustomAudio = new Audio(myAudioUrl);
                        currentCustomAudio.playbackRate = 1.0;
                        currentCustomAudio.onended = resolve;
                        currentCustomAudio.onerror = resolve;
                        currentCustomAudio.play().catch(() => resolve());
                    });
                } else {
                    await playMp3Segment(line.mp3Start, line.mp3End, 0.85);
                }

                if (!appState.isPlaying) break;
                await new Promise(r => setTimeout(r, 600));
            }

            document.querySelectorAll('.message-bubble').forEach(b => b.classList.remove('ring-2', 'ring-blue-400', 'ring-purple-400', 'ring-orange-400'));
            appState.isPlaying = false;
            mixBtnIcon.className = 'fa-solid fa-shuffle';
        }

        // =========================================================
        // ★ YouTube Iframe API 動的読み込み & タイムスタンプ同期
        // =========================================================
        function loadYouTubeVideo(videoId) {
            pendingYoutubeVideoId = videoId;
            if (!ytApiLoaded) {
                ytApiLoaded = true;
                const tag = document.createElement('script');
                tag.src = 'https://www.youtube.com/iframe_api';
                const firstScriptTag = document.getElementsByTagName('script')[0];
                firstScriptTag.parentNode.insertBefore(tag, firstScriptTag);
                return;
            }
            if (ytPlayer && typeof ytPlayer.loadVideoById === 'function') {
                ytPlayer.cueVideoById(videoId);
            }
        }

        window.onYouTubeIframeAPIReady = () => {
            if (!pendingYoutubeVideoId) return;
            ytPlayer = new YT.Player('player', {
                videoId: pendingYoutubeVideoId,
                playerVars: { playsinline: 1, rel: 0 },
                events: { onStateChange: onPlayerStateChange }
            });
        };

        function onPlayerStateChange(event) {
            if (event.data === 1) {
                if (appState.isPlaying) {
                    stopAllPlayback();
                    const playBtnIcon = document.querySelector('#play-scene-btn i');
                    const mixBtnIcon = document.querySelector('#play-mix-btn i');
                    if (playBtnIcon) playBtnIcon.className = 'fa-solid fa-play';
                    if (mixBtnIcon) mixBtnIcon.className = 'fa-solid fa-shuffle';
                    appState.isPlaying = false;
                }
                if (!ytTimeTracker) {
                    appState.lastScrolledIndex = -1;
                    ytTimeTracker = setInterval(trackYoutubeTime, 200);
                }
            } else if (ytTimeTracker) {
                clearInterval(ytTimeTracker);
                ytTimeTracker = null;
            }
        }

        function trackYoutubeTime() {
            if (!ytPlayer || typeof ytPlayer.getCurrentTime !== 'function') return;
            const currentTime = ytPlayer.getCurrentTime();

            let detectedSceneIdx = appState.currentSceneIndex;
            for (let i = 0; i < sceneStartTimes.length; i++) {
                const start = sceneStartTimes[i];
                const end = (i + 1 < sceneStartTimes.length) ? sceneStartTimes[i + 1] : Infinity;
                if (currentTime >= start && currentTime < end) {
                    detectedSceneIdx = i;
                    break;
                }
            }
            if (detectedSceneIdx !== appState.currentSceneIndex) {
                appState.currentSceneIndex = detectedSceneIdx;
                const selector = document.getElementById('scene-selector');
                if (selector) selector.value = detectedSceneIdx;
                renderScene();
                return;
            }

            const scene = scenes[appState.currentSceneIndex];
            if (!scene || !scene.lines) return;

            let activeIdx = -1;
            for (let i = 0; i < scene.lines.length; i++) {
                const line = scene.lines[i];
                if (line.startTime <= currentTime && currentTime <= line.endTime) {
                    activeIdx = i;
                    break;
                }
            }

            if (activeIdx !== -1) {
                const allMessageBubbles = document.querySelectorAll('.message-bubble');
                allMessageBubbles.forEach((b, idx) => {
                    if (idx === activeIdx) {
                        const isMuted = appState.roleplayMutedSpeaker === scene.lines[idx].speaker;
                        b.classList.add('ring-2', isMuted ? 'ring-purple-400' : 'ring-blue-400');
                    } else {
                        b.classList.remove('ring-2', 'ring-blue-400', 'ring-purple-400');
                    }
                });
                if (activeIdx !== appState.lastScrolledIndex && allMessageBubbles[activeIdx]) {
                    appState.lastScrolledIndex = activeIdx;
                    allMessageBubbles[activeIdx].scrollIntoView({ behavior: 'smooth', block: 'center' });
                }
            } else {
                document.querySelectorAll('.message-bubble').forEach(b => {
                    b.classList.remove('ring-2', 'ring-blue-400', 'ring-purple-400');
                });
            }
        }

        // =========================================================
        // ★ 録音機能（iOS Safari / Android / PC 全対応）
        // =========================================================
        function initAudioContext() {
            if (window.AudioContext || window.webkitAudioContext) {
                const AudioContext = window.AudioContext || window.webkitAudioContext;
                const ctx = new AudioContext();
                if (ctx.state === 'suspended') ctx.resume();
            }
        }

        async function toggleRecording(index, btnElement) {
            initAudioContext();
            const key = appState.currentSceneIndex + '_' + index;
            const icon = btnElement.querySelector('i');

            if (appState.activeRecordingIndex === index) {
                if (appState.mediaRecorder && appState.mediaRecorder.state !== 'inactive') {
                    appState.mediaRecorder.stop();
                }
                return;
            }
            if (appState.activeRecordingIndex !== -1) return;

            try {
                const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
                const chunks = [];
                const preferredMime = ['audio/webm', 'audio/mp4'].find(m => window.MediaRecorder && MediaRecorder.isTypeSupported(m));
                appState.mediaRecorder = preferredMime ? new MediaRecorder(stream, { mimeType: preferredMime }) : new MediaRecorder(stream);

                appState.mediaRecorder.ondataavailable = e => {
                    if (e.data.size > 0) chunks.push(e.data);
                };

                appState.mediaRecorder.onstop = () => {
                    const blob = new Blob(chunks, { type: preferredMime || 'audio/webm' });
                    appState.recordedBlobs[key] = URL.createObjectURL(blob);
                    appState.activeRecordingIndex = -1;
                    icon.className = 'fa-solid fa-microphone';
                    btnElement.classList.remove('bg-red-500', 'text-white', 'animate-pulse');
                    btnElement.classList.add('bg-gray-200', 'text-gray-500');

                    const myPlayBtn = document.getElementById(`my-audio-btn-${index}`);
                    if (myPlayBtn) myPlayBtn.classList.remove('hidden');
                    stream.getTracks().forEach(track => track.stop());
                };

                appState.activeRecordingIndex = index;
                icon.className = 'fa-solid fa-square';
                btnElement.classList.remove('bg-gray-200', 'text-gray-500');
                btnElement.classList.add('bg-red-500', 'text-white', 'animate-pulse');
                appState.mediaRecorder.start();
            } catch (err) {
                alert('マイク機能を利用できません。HTTPS接続とマイク許可を確認してください。');
            }
        }

        function playMyAudio(index) {
            initAudioContext();
            const key = appState.currentSceneIndex + '_' + index;
            const audioUrl = appState.recordedBlobs[key];
            if (!audioUrl) return;
            stopAllPlayback();
            currentCustomAudio = new Audio(audioUrl);
            currentCustomAudio.play().catch(e => console.error('録音再生失敗:', e));
        }

        // =========================================================
        // ★ 初期化 & イベント登録
        // =========================================================
        window.addEventListener('DOMContentLoaded', async () => {
            document.querySelectorAll('.ui-lang-select').forEach(sel => {
                UI_LANG_OPTIONS.forEach(optData => {
                    const opt = document.createElement('option');
                    opt.value = optData.code;
                    opt.text = optData.label;
                    sel.appendChild(opt);
                });
                sel.addEventListener('change', (e) => applyUiLanguage(e.target.value));
            });
            applyUiLanguage(detectDefaultUiLang());

            document.getElementById('mp3-lang-filter').addEventListener('change', renderMp3List);
            document.getElementById('anki-lang-filter').addEventListener('change', renderAnkiList);

            document.getElementById('auth-form').addEventListener('submit', async (e) => {
                e.preventDefault();
                const errEl = document.getElementById('auth-error');
                const btn = document.getElementById('auth-submit-btn');
                const inputKey = document.getElementById('passcode-input').value.trim();
                errEl.classList.add('hidden');
                if (!inputKey) {
                    errEl.textContent = 'パスコードを入力してください。';
                    errEl.classList.remove('hidden');
                    return;
                }
                btn.disabled = true;
                btn.innerHTML = `<i class="fa-solid fa-spinner fa-spin"></i><span>${escapeHtml(t('authChecking'))}</span>`;
                try {
                    await authenticateAndLoad(inputKey);
                } catch (err) {
                    errEl.textContent = t('authInvalid');
                    errEl.classList.remove('hidden');
                } finally {
                    btn.disabled = false;
                    btn.innerHTML = `<i class="fa-solid fa-unlock-keyhole"></i><span id="auth-submit-text">${escapeHtml(t('authSubmit'))}</span>`;
                }
            });

            document.querySelectorAll('.nav-tab-btn').forEach(btn => {
                btn.addEventListener('click', () => switchTab(btn.dataset.tab));
            });

            document.getElementById('mp3-search').addEventListener('input', renderMp3List);
            document.getElementById('anki-search').addEventListener('input', renderAnkiList);

            document.getElementById('refresh-catalog-btn').addEventListener('click', async () => {
                if (!portalState.passkey) return;
                portalState.lessonDetailCache = {};
                portalState.srtCache = {};
                await authenticateAndLoad(portalState.passkey, true);
            });

            document.getElementById('logout-btn').addEventListener('click', () => {
                stopAllPlayback();
                localStorage.removeItem(STORAGE_KEY_NAME);
                portalState.passkey = '';
                portalState.tier = null;
                portalState.catalog = null;
                document.getElementById('portal-shell').classList.add('hidden');
                document.getElementById('auth-screen').classList.remove('hidden');
                document.getElementById('passcode-input').value = '';
            });

            document.getElementById('lesson-selector').addEventListener('change', (e) => {
                loadWebAppLesson(e.target.value);
            });

            document.getElementById('scene-selector').addEventListener('change', (e) => {
                const sceneIdx = parseInt(e.target.value, 10);
                appState.currentSceneIndex = sceneIdx;
                if (appState.isPlaying) playEntireScene();
                renderScene();
                if (ytPlayer && typeof ytPlayer.seekTo === 'function' && sceneStartTimes[sceneIdx] !== undefined) {
                    ytPlayer.seekTo(sceneStartTimes[sceneIdx], true);
                }
            });

            document.getElementById('toggle-japanese').addEventListener('change', (e) => {
                appState.showJapanese = e.target.checked;
                renderScene();
            });
            document.getElementById('toggle-romaji').addEventListener('change', (e) => {
                appState.showRomaji = e.target.checked;
                renderScene();
            });
            document.getElementById('toggle-translation').addEventListener('change', (e) => {
                appState.showTranslation = e.target.checked;
                renderScene();
            });
            document.getElementById('lang-selector').addEventListener('change', async (e) => {
                appState.currentLang = e.target.value;
                if (appState.isPlaying) playEntireScene();
                await updateTranslations();
                await updateSceneTitles();
                await updateSceneStartTimes();
                renderSceneSelector();
                renderScene();
            });
            document.getElementById('toggle-kanji-test').addEventListener('change', (e) => {
                appState.hideFurigana = e.target.checked;
                renderScene();
            });
            document.getElementById('roleplay-selector').addEventListener('change', (e) => {
                appState.roleplayMutedSpeaker = e.target.value;
                renderScene();
            });

            // URLパラメータ ?key=... または保存済みキーで自動ログイン
            const urlKey = new URLSearchParams(window.location.search).get('key');
            const savedKey = urlKey || localStorage.getItem(STORAGE_KEY_NAME);
            if (savedKey) {
                try {
                    await authenticateAndLoad(savedKey);
                } catch (e) {
                    localStorage.removeItem(STORAGE_KEY_NAME);
                }
            }
        });
    </script>
</body>
