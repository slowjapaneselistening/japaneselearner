            transition: all 0.3s ease-out;
            white-space: nowrap;

let quizData = [];
let scenes = [];

        async function parseData() {
            scenes = [];
            for (let i = 1; i <= 10; i++) {
                try {
                    const response = await fetch(`scenes/Output_Job${i}/final_sentences.json`);
                    if (!response.ok) throw new Error(`Failed to fetch scene ${i}`);
                    const data = await response.json();
                    
                    const lines = data.map(item => {
                        const speakerName = `Speaker ${item.speaker}`;
                        
                        let correctedAudio = '';
                        if (item.audioPath) {
                            // フォルダ名の変更と、日本語ファイル名対応のためのURLエンコード
                            const replacedPath = item.audioPath.replace('clips/', `scenes/Output_Job${i}/clips/`);
                            correctedAudio = encodeURI(replacedPath);
                        }
                        
                        return {
                            speaker: speakerName,
                            rawJp: item.japaneseFurigana,
                            speakText: item.japaneseFurigana.replace(/\(.*?\)/g, ''),
                            english: item.exampleEn || "Translation not available.",
                            romaji: item.exampleRomaji || "",
                            audioPath: correctedAudio
                        };
                    });
                    scenes.push({ lines: lines });
                } catch (e) {
                    console.error(`Error loading scene ${i}:`, e);
                    scenes.push({ lines: [] });
                }
            }
            await updateTranslations();
        }

        async function loadSRT(langCode) {
            if (srtDataCache[langCode]) return srtDataCache[langCode];
            try {
                const response = await fetch(`translations/sub_${langCode}.srt`);
                if (!response.ok) return null;
                const text = await response.text();
                const blocks = text.trim().split(/\r?\n\r?\n/);
                // SRTの各ブロックから字幕テキスト部分（3行目以降）を抽出して配列にする
                const srtTexts = blocks.map(block => {
                    const lines = block.split(/\r?\n/);
                    return lines.length >= 3 ? lines.slice(2).join('\n').trim() : '';
                });
                
                srtDataCache[langCode] = srtTexts;
                return srtTexts;
            } catch (e) {
                console.error(`Error loading SRT for ${langCode}:`, e);
                return null;
            }
        }

        async function updateTranslations() {
            const langCode = appState.currentLang;
            const srtTexts = await loadSRT(langCode);
            if (!srtTexts || srtTexts.length === 0) return;

            let globalIdx = 0;
            scenes.forEach(scene => {
                // 各シーンの先頭に存在する「タイトル行（SRTの1ブロック分）」を正確に1つスキップ
                globalIdx++;
                
                scene.lines.forEach(line => {
                    if (globalIdx < srtTexts.length) {
                        line.english = srtTexts[globalIdx] || "Translation not available.";
                    }
                    globalIdx++;
                });
            });
        }

        function generateRomaji(text) {
            // Simple mapping for demonstration purposes
            const map = {
                'こんにちは':'konnichiwa', 'おはよう':'ohayou', 'ありがとう':'arigatou',
                'はい':'hai', 'いいえ':'iie', 'すみません':'sumimasen'
            };
            let romaji = text;
            for (let k in map) {
                romaji = romaji.replace(new RegExp(k, 'g'), map[k]);
            }
            return romaji || "Romaji not fully generated";
        }

        function formatJapanese(rawJp, hideFurigana) {
            // 正規表現を修正し、漢字（と「々」）の直後にあるカッコのみを「ふりがな」として処理します
            return rawJp.replace(/([\u4E00-\u9FFF\u3005]+)\((.*?)\)/g, (match, kanji, ruby) => {
                if (hideFurigana) {
                    return `<span class="kanji-hidden" onclick="revealFurigana(this)"><span class="kanji-text">${kanji}</span><span class="kanji-revealed">${ruby}</span></span>`;
                } else {
                    return `<ruby>${kanji}<rt>${ruby}</rt></ruby>`;
                }
            });
        }

        window.revealFurigana = function(element) {
            element.classList.toggle('show-ruby');
        };

        function renderScene() {
            const container = document.getElementById('dialogue-list');
            container.innerHTML = '';
            
            const scene = scenes[appState.currentSceneIndex];
            
            scene.lines.forEach((line, index) => {
                const isSpeaker1 = line.speaker === "Speaker 1";
                const alignment = isSpeaker1 ? "self-start" : "self-end";
                const bgColor = isSpeaker1 ? "speaker-1-bg border border-gray-200" : "speaker-2-bg border border-green-100";
                const borderRadius = isSpeaker1 ? "rounded-tr-2xl rounded-br-2xl rounded-bl-2xl" : "rounded-tl-2xl rounded-br-2xl rounded-bl-2xl";
                const icon = isSpeaker1 ? "fa-user-tie" : "fa-user";
                const iconColor = isSpeaker1 ? "text-gray-500" : "text-green-600";

                const jpFormatted = formatJapanese(line.rawJp, appState.hideFurigana);

                let extraContent = '';
                if (appState.showRomaji) {
                    extraContent += `<div class="text-sm text-gray-500 mt-2 font-mono bg-gray-50 p-2 rounded">${line.romaji}</div>`;
                }
                if (appState.showTranslation) {
                    extraContent += `<div class="text-sm text-gray-700 mt-2 italic border-l-2 border-gray-300 pl-2">${line.english}</div>`;
                }

                // Roleplay logic
                const isMuted = appState.roleplayMutedSpeaker === line.speaker;
                const blurClass = isMuted ? "blur-sm opacity-50 hover:blur-none hover:opacity-100 transition-all duration-300 cursor-pointer" : "";
                const titleText = isMuted ? "title='Hover to reveal (Roleplay mode)'" : "";

                const html = `
                    <div class="flex gap-3 max-w-[95%] sm:max-w-[85%] ${alignment} fade-in" style="animation-delay: ${index * 0.05}s">
                        ${isSpeaker1 ? `<div class="w-8 h-8 rounded-full bg-gray-200 flex items-center justify-center shrink-0 mt-1"><i class="fa-solid ${icon} ${iconColor} text-sm"></i></div>` : ''}
                        
                        <div class="flex flex-col gap-1 w-full">
                            <div class="text-xs text-gray-500 font-medium px-1 ${!isSpeaker1 ? 'text-right' : ''}">${line.speaker} ${isMuted ? ' <span class="text-purple-600 font-bold ml-1"><i class="fa-solid fa-microphone-lines"></i> Your Turn</span>' : ''}</div>
                            <div class="${bgColor} ${borderRadius} p-4 shadow-sm relative group w-full transition-shadow duration-300">
                                <div class="flex items-start gap-3 justify-between">
                                    <div class="flex-1 ${blurClass}" ${titleText}>
                                        <div class="text-[1.05rem] leading-loose break-words tracking-wide font-medium">
                                            ${jpFormatted}
                                        </div>
                                        ${extraContent}
                                    </div>
                                    <button onclick="playAudio('${line.audioPath ? line.audioPath.replace(/'/g, "\\'") : ''}')" class="shrink-0 w-8 h-8 rounded-full bg-gray-100 hover:bg-blue-100 text-gray-400 hover:text-blue-600 flex items-center justify-center transition-colors focus:outline-none focus:ring-2 focus:ring-blue-300" title="Play audio">
                                        <i class="fa-solid fa-volume-high"></i>
                                    </button>
                                </div>
                            </div>
                        </div>

                        ${!isSpeaker1 ? `<div class="w-8 h-8 rounded-full bg-green-100 flex items-center justify-center shrink-0 mt-1"><i class="fa-solid ${icon} ${iconColor} text-sm"></i></div>` : ''}
                    </div>
                `;
                container.insertAdjacentHTML('beforeend', html);
            });
        }

        let currentAudio = null;

        function playAudio(audioPath) {
            if (currentAudio) {
                currentAudio.pause();
            }
            if (!audioPath) return;
            currentAudio = new Audio(audioPath);
            currentAudio.playbackRate = 0.85;
            currentAudio.play().catch(e => console.error("Audio play failed:", e));
        }

        async function playEntireScene() {
            const playBtnIcon = document.querySelector('#play-scene-btn i');

            if (appState.isPlaying) {
                if (currentAudio) currentAudio.pause();
                appState.isPlaying = false;
                playBtnIcon.className = 'fa-solid fa-play';
                document.querySelectorAll('#dialogue-list > div > div > div.p-4').forEach(b => b.classList.remove('ring-2', 'ring-blue-400', 'ring-purple-400'));
                return;
            }

            appState.isPlaying = true;
            playBtnIcon.className = 'fa-solid fa-stop';
            const scene = scenes[appState.currentSceneIndex];
            
            for (let i = 0; i < scene.lines.length; i++) {
                if (!appState.isPlaying) break; 
                
                const line = scene.lines[i];
                const isMuted = appState.roleplayMutedSpeaker === line.speaker;

                const allMessageBubbles = document.querySelectorAll('#dialogue-list > div > div > div.p-4');
                if (allMessageBubbles[i]) {
                    allMessageBubbles.forEach(b => b.classList.remove('ring-2', 'ring-blue-400', 'ring-purple-400'));
                    allMessageBubbles[i].classList.add('ring-2', isMuted ? 'ring-purple-400' : 'ring-blue-400');
                    allMessageBubbles[i].scrollIntoView({ behavior: 'smooth', block: 'center' });
                }
                
                if (isMuted) {
                    const waitTime = 1500 + (line.speakText.length * 150);
                    await new Promise(r => setTimeout(r, waitTime));
                } else {
                    if (line.audioPath) {
                        await new Promise(resolve => {
                            if (currentAudio) currentAudio.pause();
                            currentAudio = new Audio(line.audioPath);
                            currentAudio.playbackRate = 0.85;
                            currentAudio.onended = resolve;
                            currentAudio.onerror = resolve;
                            currentAudio.play().catch(e => {
                                console.error("Audio play failed in loop:", e);
                                resolve();
                            });
                        });
                    } else {
                        await new Promise(r => setTimeout(r, 1000));
                    }
                }
                
                await new Promise(r => setTimeout(r, 600));
            }

            if (appState.isPlaying) {
                document.querySelectorAll('#dialogue-list > div > div > div.p-4').forEach(b => b.classList.remove('ring-2', 'ring-blue-400', 'ring-purple-400'));
            }

            appState.isPlaying = false;
            playBtnIcon.className = 'fa-solid fa-play';
        }

        function startQuiz() {
            appState.score = 0;
            appState.currentQuestionIndex = 0;
            
            const typeSelector = document.getElementById('quiz-type-selector');
            if (typeSelector) {
                appState.quizType = typeSelector.value;
            }
            
            if (appState.quizType === 'kanji') {
                quizData = quizDataKanji;
            } else if (appState.quizType === 'culture') {
                quizData = quizDataCulture;
            } else if (appState.quizType === 'grammar') {
                quizData = quizDataGrammar;
            }
            
            document.getElementById('quiz-intro').classList.add('hidden');
            document.getElementById('quiz-result').classList.add('hidden');
            document.getElementById('quiz-area').classList.remove('hidden');
            
            loadQuestion();
        }

        function loadQuestion() {
            appState.isAnswering = false;
            const qData = quizData[appState.currentQuestionIndex];
            
            document.getElementById('quiz-progress').innerText = `Question ${appState.currentQuestionIndex + 1} / ${quizData.length}`;
            document.getElementById('quiz-score').innerText = `Score: ${appState.score}`;
            document.getElementById('quiz-question').innerHTML = qData.q;
            
            const optionsContainer = document.getElementById('quiz-options');
            optionsContainer.innerHTML = '';
            
            // 選択肢のインデックスを保持したままシャッフル
            const shuffledOptions = qData.options.map((opt, idx) => ({ text: opt, originalIndex: idx }));
            for (let i = shuffledOptions.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [shuffledOptions[i], shuffledOptions[j]] = [shuffledOptions[j], shuffledOptions[i]];
            }
            
            shuffledOptions.forEach((opt) => {
                const btn = document.createElement('button');
                btn.className = "w-full bg-white border-2 border-gray-200 hover:border-blue-500 hover:bg-blue-50 text-gray-700 font-bold py-4 px-6 rounded-xl text-lg sm:text-xl transition-all shadow-sm text-left sm:text-center";
                btn.innerHTML = opt.text;
                btn.dataset.originalIndex = opt.originalIndex;
                btn.onclick = () => checkAnswer(opt.originalIndex, btn);
                optionsContainer.appendChild(btn);
            });
        }

        function checkAnswer(selectedIndex, btnElement) {
            if (appState.isAnswering) return;
            appState.isAnswering = true;
            
            const correctIndex = quizData[appState.currentQuestionIndex].answer;
            const isCorrect = selectedIndex === correctIndex;
            
            if (isCorrect) {
                appState.score++;
                btnElement.classList.remove('border-gray-200', 'hover:border-blue-500', 'hover:bg-blue-50', 'text-gray-700');
                btnElement.classList.add('bg-green-500', 'text-white', 'border-green-500');
            } else {
                btnElement.classList.remove('border-gray-200', 'hover:border-blue-500', 'hover:bg-blue-50', 'text-gray-700');
                btnElement.classList.add('bg-red-500', 'text-white', 'border-red-500');
                
                // シャッフル後の配置に対応した正解のハイライト
                const allButtons = document.getElementById('quiz-options').children;
                for (let btn of allButtons) {
                    if (parseInt(btn.dataset.originalIndex) === correctIndex) {
                        btn.classList.remove('border-gray-200');
                        btn.classList.add('border-green-500', 'bg-green-50', 'text-green-700');
                    }
                }
            }
            
            document.getElementById('quiz-score').innerText = `Score: ${appState.score}`;
            
            setTimeout(() => {
                appState.currentQuestionIndex++;
                if (appState.currentQuestionIndex < quizData.length) {
                    loadQuestion();
                } else {
                    showResult();
                }
            }, 1200);
        }

        function showResult() {
            document.getElementById('quiz-area').classList.add('hidden');
            document.getElementById('quiz-result').classList.remove('hidden');
            document.getElementById('final-score').innerText = appState.score;
        }

       function switchTab(tabId) {
            appState.activeTab = tabId;
            
            const convBtn = document.getElementById('tab-btn-conv');
            const quizBtn = document.getElementById('tab-btn-quiz');
            const convBtnLand = document.getElementById('tab-btn-conv-land');
            const quizBtnLand = document.getElementById('tab-btn-quiz-land');
            const convDiv = document.getElementById('tab-conv');
            const quizDiv = document.getElementById('tab-quiz');
            
            const activeClass = "px-4 py-2 rounded-md bg-white shadow text-blue-600 font-medium text-sm transition-all";
            const inactiveClass = "px-4 py-2 rounded-md text-gray-500 hover:text-gray-700 font-medium text-sm transition-all";
            const activeClassLand = "flex-1 px-4 py-1.5 rounded-md bg-white shadow text-blue-600 font-medium text-xs transition-all text-center";
            const inactiveClassLand = "flex-1 px-4 py-1.5 rounded-md text-gray-500 hover:text-gray-700 font-medium text-xs transition-all text-center";
            
            if (tabId === 'conv') {
                if(convBtn) convBtn.className = activeClass;
                if(quizBtn) quizBtn.className = inactiveClass;
                if(convBtnLand) convBtnLand.className = activeClassLand;
                if(quizBtnLand) quizBtnLand.className = inactiveClassLand;
                if(convDiv) convDiv.classList.remove('hidden');
                if(quizDiv) quizDiv.classList.add('hidden');
            } else {
                if(quizBtn) quizBtn.className = activeClass;
                if(convBtn) convBtn.className = inactiveClass;
                if(quizBtnLand) quizBtnLand.className = activeClassLand;
                if(convBtnLand) convBtnLand.className = inactiveClassLand;
                if(quizDiv) quizDiv.classList.remove('hidden');
                if(convDiv) convDiv.classList.add('hidden');
                
                // Reset Quiz
                const quizIntro = document.getElementById('quiz-intro');
                const quizArea = document.getElementById('quiz-area');
                const quizResult = document.getElementById('quiz-result');
                if(quizIntro) quizIntro.classList.remove('hidden');
                if(quizArea) quizArea.classList.add('hidden');
                if(quizResult) quizResult.classList.add('hidden');
            }
        }

const YOUTUBE_VIDEO_ID = 'YqZs9vy8PZg'; // 英数字11桁の動画ID
const sceneStartTimes = [10, 124, 240, 345, 455, 546, 664, 786, 896, 1012]; // 各シーンの開始秒数（Scene1〜10）
// ==========================================
        let ytPlayer = null;

        // YouTube Iframe API スクリプトを自動動的ロード
        const tag = document.createElement('script');
        tag.src = "https://www.youtube.com/iframe_api";
        const firstScriptTag = document.getElementsByTagName('script')[0];
        firstScriptTag.parentNode.insertBefore(tag, firstScriptTag);

        // API読み込み完了時に自動実行される関数
        window.onYouTubeIframeAPIReady = () => {
            ytPlayer = new YT.Player('player', {
                videoId: YOUTUBE_VIDEO_ID,
                playerVars: {
                    'playsinline': 1,
                    'rel': 0
                }
            });
        };

        window.onload = async () => {
            // Populate Language Selector
            const langSelector = document.getElementById('lang-selector');
            Object.keys(LANG_MAP).forEach(langName => {
                const opt = document.createElement('option');
                opt.value = LANG_MAP[langName];
                opt.text = langName;
                if (LANG_MAP[langName] === 'en') opt.selected = true;
                langSelector.appendChild(opt);
            });

            await parseData();

            const selector = document.getElementById('scene-selector');
            for (let i = 0; i < 10; i++) {
                const opt = document.createElement('option');
                opt.value = i;
                opt.text = sceneTitles[i] || `Scene ${i + 1}`;
                selector.appendChild(opt);
            }

            selector.addEventListener('change', (e) => {
                const sceneIdx = parseInt(e.target.value);
                appState.currentSceneIndex = sceneIdx;
                if(appState.isPlaying) playEntireScene(); // Stop if playing
                renderScene();

                // シーン選択時にYouTubeの再生位置を対応する秒数へジャンプさせる
                if (ytPlayer && typeof ytPlayer.seekTo === 'function') {
                    ytPlayer.seekTo(sceneStartTimes[sceneIdx], true);
                }
            });

            document.getElementById('toggle-romaji').addEventListener('change', (e) => {
                appState.showRomaji = e.target.checked;
                renderScene();
            });

            document.getElementById('toggle-translation').addEventListener('change', (e) => {
                appState.showTranslation = e.target.checked;
                renderScene();
            });

            langSelector.addEventListener('change', async (e) => {
                appState.currentLang = e.target.value;
                if (appState.isPlaying) playEntireScene();
                await updateTranslations();
                renderScene();
            });

            document.getElementById('toggle-kanji-test').addEventListener('change', (e) => {
                appState.hideFurigana = e.target.checked;
                renderScene();
            });

            document.getElementById('roleplay-selector').addEventListener('change', (e) => {
                appState.roleplayMutedSpeaker = e.target.value;
                renderScene();
            });

            document.getElementById('tab-btn-conv').addEventListener('click', () => switchTab('conv'));
            document.getElementById('tab-btn-quiz').addEventListener('click', () => switchTab('quiz'));

            renderScene();
        };
    </script>
