<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ZenStep Japanese - Fullscreen Grammar</title>
    <style>
        /* =========================================================
           基本スタイル設定
           ========================================================= */
        @import url('https://fonts.googleapis.com/css2?family=Klee+One:wght@600;700&family=Noto+Sans+JP:wght@500;600;700;800&display=swap');
        
        :root {
            --text-color: #FFFFFF; 
            --accent-color: #FFD54F;
            --spk1-bg: #C62828; /* 少し濃い赤へ変更（視認性向上） */
            --spk2-bg: #0055FF; /* スピーカー2（青） */
            --label-bg: rgba(0, 0, 0, 0.75);
        }
        
        body {
            font-family: 'Noto Sans JP', sans-serif; font-weight: 800;
            background-color: transparent; color: var(--text-color); margin: 0; padding: 0;
            display: flex; justify-content: center; align-items: center; height: 100vh; overflow: hidden;
            box-sizing: border-box; transition: none;
        }
        
        #background-video, #background-image { position: fixed; top: 0; left: 0; width: 100%; height: 100%; z-index: -100; object-fit: cover; object-position: right bottom; display: none; }
        
        .container { width: 90vw; max-width: 1280px; max-height: 90vh; background-color: transparent; border: none; display: flex; flex-direction: column; position: relative; }
        .screen { padding: 2vh 4vw; text-align: center; display: flex; flex-direction: column; align-items: center; height: 100%; }

        /* =========================================================
           新1周目用: Grammar2 パネル (安全に新規追加)
           ========================================================= */
        #grammar2-panel {
            position: fixed; top: 0; left: 0; width: 100%; height: 100vh;
            display: none; flex-direction: column;
            z-index: 2150; box-sizing: border-box;
        }
        body.mode-grammar2-active #grammar2-panel { display: flex; }

        /* 場面転換用パネル */
        #transition-panel {
            position: fixed; top: 0; left: 0; width: 100%; height: 100vh;
            display: none; flex-direction: column; justify-content: center; align-items: center;
            z-index: 3000; background-color: rgba(0,0,0,0.4);
        }
        body.mode-transition-active #transition-panel { display: flex; }
        .transition-content { text-align: center; color: #FFF; text-shadow: 3px 3px 10px #000; }
        .transition-scene-num { font-size: 5rem; font-weight: 900; color: var(--accent-color); margin-bottom: 2vh; }
        .transition-title { font-size: 4rem; font-weight: 800; border-top: 4px solid #FFF; padding-top: 2vh; }
        .transition-title-en { font-size: 2.5rem; font-weight: 700; color: #FFD54F; margin-top: 1vh; }
        #transition-panel rt { font-size: 0.55em; color: #FFFFFF !important; font-weight: 700; text-shadow: 2px 2px 0 #000; }

        .g2-top-section {
            height: 68vh; display: flex; align-items: flex-start; justify-content: center;
            padding: 40px 53px 0 53px; box-sizing: border-box; width: 100%;
        }

        .g2-bottom-section {
            flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: flex-start;
            padding: 0 53px 40px 53px; box-sizing: border-box; width: 100%;
        }

        .g2-grammar-container {
            display: flex; flex-direction: column; align-items: center; gap: 12px; /* ★ 中央寄せに変更 */
            width: 100%; max-width: 1280px; font-size: 42px;
            margin: 0 auto;
        }

        .g2-grammar-item {
            background-color: var(--label-bg); border-left: 12px solid var(--accent-color);
            padding: 16px 33px; font-size: inherit; color: var(--accent-color);
            border-radius: 8px; box-shadow: 0 3px 15px rgba(0,0,0,0.7);
            box-sizing: border-box; line-height: 1.3;
            max-width: 95%; /* ★ 画面幅を最大限使えるように制限を緩和 */
            width: fit-content; /* ★ 中身のテキストに合わせて自然に枠を広げる */
            
            /* ★ 3分割レイアウト用のFlex設定 */
            display: flex; flex-direction: row; align-items: center; justify-content: center;
            gap: 15px; /* 左右と記号の隙間 */
        }
        
        /* ★ 新規追加：3分割された各パーツのスタイル */
        .g2-part-left {
            display: flex; flex-direction: column; align-items: flex-end; /* 日本語は右揃えで記号に寄せる */
            text-align: right;
        }
        .g2-part-left-main { 
            font-weight: 800; 
            white-space: nowrap; /* ★ 漢字とルビ、送り仮名の強制改行による縦割れを絶対防止 */
        }
        .g2-part-left-sub { font-size: 0.75em; color: #CCC; margin-top: 4px; font-weight: 600; white-space: nowrap; } /* 日本語の下のカッコ訳 */
        
        .g2-part-symbol {
            color: #FF8A80; /* 記号を少し目立つ色に */
            font-weight: 900; padding: 0 10px;
            font-size: 1.5em; /* ★ 記号を1.5倍に拡大して目立たせる */
        }
        
        .g2-part-right {
            display: flex; flex-direction: column; align-items: flex-start; /* ★ 右枠も2段組み（上下）に対応 */
            text-align: left; color: #FFF; /* 翻訳は白文字に */
            font-size: 1.0em; font-weight: 700;
        }
        .g2-part-right-main {
            white-space: nowrap; /* ★ 右枠の日本語＋ルビ・送り仮名が絶対に縦に割れないように保護 */
        }
        .g2-part-right-sub {
            font-size: 0.75em; color: #CCC; margin-top: 4px; font-weight: 600;
            white-space: nowrap; /* ★ カッコ内の訳が途中で改行されるのを防止 */
        }

        .g2-sentence-box {
            padding: 24px 40px 24px 30px;
            font-size: 44px;
            line-height: 1.5;
            max-width: 90vw;
            width: fit-content; /* テキストに合わせて枠を広げる */
            box-sizing: border-box;
            background-color: #FFFFFF;
            color: #000000;
            font-feature-settings: "palt" 1;
            border-radius: 12px;
            box-shadow: 0 8px 25px rgba(0,0,0,0.4);
            display: block;
            white-space: normal;
            word-break: normal;
            overflow-wrap: anywhere;
            text-align: left;
        }
        body[data-speaker="1"] .g2-sentence-box { border-left: 12px solid var(--spk1-bg); }
        body[data-speaker="2"] .g2-sentence-box { border-left: 12px solid var(--spk2-bg); }
        
        .g2-sentence-box rt { color: #000000 !important; text-shadow: none !important; }

        /* 非表示クラスのアップデート（新画面も追加） */
        body.forced-hidden #scroll-list-panel, body.forced-hidden #ex-detail-panel, body.forced-hidden #ex-grammar-panel, body.forced-hidden #grammar2-panel, body.forced-hidden #speaker-icon-panel, body.forced-hidden #ja-text-only-panel { display: none !important; }

        /* =========================================================
           新画面：スピーカーアイコンのみ
           ========================================================= */
        #speaker-icon-panel {
            position: fixed; top: 0; left: 0; width: 100%; height: 100vh;
            display: none; justify-content: center; align-items: center;
            z-index: 2300; background-color: rgba(0,0,0,0.5); /* 背景を少し暗く */
        }
        body.mode-speaker-icon-active #speaker-icon-panel { display: flex; }
        .speaker-icon-svg {
            width: 300px; height: 300px; fill: var(--accent-color);
            filter: drop-shadow(0 0 20px rgba(255, 213, 79, 0.5));
            animation: pulse 1s infinite alternate; /* 音が鳴っているようなアニメーション */
        }
        @keyframes pulse { from { transform: scale(1); } to { transform: scale(1.15); } }

        /* =========================================================
           新画面：日本語テキストのみ（ローマ字併記）
           ========================================================= */
        #ja-text-only-panel {
            position: fixed; top: 0; left: 0; width: 100%; height: 100vh;
            display: none; flex-direction: column; justify-content: center; align-items: center;
            z-index: 2300; background-color: rgba(0,0,0,0.7);
            padding: 0 5vw; box-sizing: border-box;
            gap: 3vh; /* 日本語とローマ字の間の隙間 */
        }
        body.mode-ja-text-only-active #ja-text-only-panel { display: flex; }
        .ja-only-text {
            font-size: 5rem; font-weight: 800; color: #FFF; text-align: center;
            text-shadow: 4px 4px 15px rgba(0,0,0,0.9);
            line-height: 1.5; white-space: normal; word-break: normal; overflow-wrap: anywhere;
            display: inline-block; max-width: 1400px;
        }
        .ja-only-romaji {
            font-size: 60px; font-weight: 700; color: #EEE; text-align: center;
            text-shadow: 3px 3px 10px rgba(0,0,0,0.9);
            display: inline-block; max-width: 1400px;
        }

        /* ---------------------------------------------------------
           ★ カラーボックス（背景塗り・枠なし）
           --------------------------------------------------------- */
        .fit-box {
            display: inline-block !important;
            border-radius: 12px;
            padding: 24px 32px 12px 32px; /* ★ 上のパディングを増やしてルビのための背景領域を確保 */
            box-shadow: 0 4px 18px rgba(0,0,0,0.6);
            box-sizing: border-box;
            border: none !important;
            max-width: 90vw;
        }

        body[data-speaker="1"] .highlight-box { background-color: var(--spk1-bg) !important; }
        body[data-speaker="2"] .highlight-box { background-color: var(--spk2-bg) !important; }
        .idle-box { background-color: rgba(60, 60, 60, 0.9) !important; }

        /* ---------------------------------------------------------
           ★ 補助情報用プレート
           --------------------------------------------------------- */
        .text-plate {
            display: inline-block;
            background-color: var(--label-bg);
            padding: 4px 18px;
            border-radius: 8px;
            margin-top: 8px;
            text-shadow: 1px 1px 2px #000;
        }

        /* ★ ふりがな（ルビ）をすべてのパネルで白に固定 */
        rt { font-size: 0.55em; color: #FFFFFF !important; font-weight: 700; text-shadow: 2px 2px 0 #000; }
        ruby { ruby-position: over; }

        /* =========================================================
           1周目: 3段表示スクロールリスト
           ========================================================= */
        #scroll-list-panel {
            position: fixed; bottom: 0; left: 0; width: 100%; height: 60vh; /* ★ 3つの2行ボックスを収めるため45vhから60vhに拡張 */
            display: none; flex-direction: column; justify-content: center;
            z-index: 2100; padding-bottom: 2vh;
        }
        body.mode-scroll-active #scroll-list-panel { display: flex; }

        .scroll-row { width: 100%; display: flex; flex-direction: column; align-items: flex-start; justify-content: center; margin: 0.2vh 0; overflow: visible; padding-left: 6vw; box-sizing: border-box; }
        .scroll-ja { 
            font-size: 2.2rem; font-weight: 800; line-height: 1.5; text-align: left; color: #FFF; width: 100%;
            white-space: normal; word-break: keep-all; line-break: strict; /* ★ 自動改行とルビの分断保護 */
            height: 6.6rem; max-height: 6.6rem;
            overflow: visible; /* ★ hiddenを解除してルビが隠れないようにします */
            display: block;
        }
        
        /* ★ ローマ字のフォントサイズを1.4remから2.0remに拡大 */
        .scroll-ro { font-size: 2.0rem; color: #EEE; text-align: center; font-weight: 700; }
        
        .prev-style { opacity: 0.7; transform: scale(0.9); transform-origin: left center; } /* ★ 基準点を左に固定 */
        .curr-style { opacity: 1.0; }
        .next-style { opacity: 0.85; transform: scale(0.95); transform-origin: left center; } /* ★ 基準点を左に固定 */

        /* =========================================================
           2周目: 例文詳細パネル
           ========================================================= */
        #ex-detail-panel {
            position: fixed; bottom: 8vh;
            left: 0; width: 100%; height: 35vh;
            display: none; flex-direction: column; align-items: flex-start; justify-content: center;
            z-index: 2100; padding: 10px 10px 10px 6vw; box-sizing: border-box;
        }
        body.mode-ex-detail-active #ex-detail-panel { display: flex; }

        #ex-det-ja { 
            font-size: 2.4rem; font-weight: 800; line-height: 1.5; text-align: left; width: 100%;
            white-space: normal; word-break: keep-all; line-break: strict; /* ★ 自動改行とルビの分断保護 */
            height: 7.2rem; max-height: 7.2rem; /* ★ 2.4rem * 1.5 * 2行 = 7.2rem (2行分のスペースを固定確保) */
            overflow: hidden; /* はみ出し防止 */
            display: block; /* ★ flexを解除し、文章の縦割れを直します */
        }
        #ex-det-romaji { font-size: 2.2rem; color: #FFF; font-weight: 700; }
        #ex-det-en { font-size: 2.2rem; color: var(--accent-color); font-weight: 700; }

        /* =========================================================
           3周目: 文法・解説（全画面化・文字サイズ拡大）
           ========================================================= */
        #ex-grammar-panel {
            position: fixed; top: 0; left: 0; width: 100%; height: 100vh;
            background-color: rgba(0, 0, 0, 0.50); backdrop-filter: blur(15px);
            border: none; display: none; flex-direction: column;
            justify-content: flex-start; align-items: center; /* ★ 上揃えに変更 */
            padding: 15vh 6vw 4vh 6vw; overflow: hidden; box-sizing: border-box; /* ★ 上部に15vhの固定開始位置を設定 */
            z-index: 2200;
        }
        body.mode-ex-grammar-active #ex-grammar-panel { display: flex; }
        
        /* ★ 文法解説の文字サイズを全体的に拡大 */
        .grammar-ja { font-size: 4.0rem; font-weight: 800; color: var(--accent-color); text-shadow: 3px 3px 0 #000; text-align: center; line-height: 1.3; display: block; width: 100%; white-space: normal; word-break: keep-all; line-break: strict; height: 10.4rem; max-height: 10.4rem; overflow: hidden; box-sizing: border-box; }
        .grammar-en { font-size: 4.0rem; color: #EEE; margin-top: 12px; text-align: center; font-weight: 700; display: inline-block; white-space: nowrap; } /* ★ 1行固定の指示を追加 */
        #ex-grammar-panel rt { color: var(--accent-color) !important; font-size: 0.5em; } 
        /* 解説エリアの大枠を2カラムのGridレイアウトに変更（無駄な隙間をカット） */
        .grammar-exp { 
            display: grid; 
            grid-template-columns: 1fr 1fr; 
            gap: 1vh 1.5vw; 
            margin-top: 1.5vh; 
            max-width: 1500px; 
            width: 100%; 
            align-items: stretch;
            font-size: 48px; /* ★ 確実に36pxに固定 */
        }

        /* 各要素（箱）のデザイン：極限までスリム化 */
        .grammar-exp-item {
            background-color: rgba(255, 255, 255, 0.1);
            border-left: 6px solid var(--accent-color);
            padding: 6px 16px; 
            border-radius: 6px;
            line-height: 1.3; 
            color: #FFF;
            box-shadow: 0 2px 6px rgba(0,0,0,0.3);
            word-break: break-word;
            font-size: inherit; 
        }
        /* 【Focus】専用の装飾スタイルは削除しました */
        .highlight-gold { color: var(--accent-color); font-weight: bold; }
        .highlight-red  { color: #FF8A80; font-weight: bold; }
        

        /* 漢字クイズ用バッジ（リスニングバッジとの被り防止のため位置調整） */
        #kanji-badge-container {
            position: fixed; top: 3vh; right: 3vw; display: none; 
            flex-direction: column; align-items: flex-end; z-index: 9999;
        }
        body.show-kanji-badge #kanji-badge-container { display: flex; }
        .kanji-badge-item { background-color: #FFD54F; color: #000; font-size: 1.8rem; font-weight: 800; padding: 5px 20px; border-radius: 50px; border: 2px solid #FFF; }

        /* ★追加: 左上のスピーカー＋スピード表示バッジ */
        #speed-badge-container {
            position: fixed; top: 3vh; left: 3vw; display: none;
            align-items: center; gap: 10px; z-index: 9999;
            background-color: rgba(0, 0, 0, 0.6); padding: 6px 16px;
            border-radius: 50px; border: 2px solid #FFF;
            box-shadow: 0 4px 10px rgba(0,0,0,0.3);
        }
        .speed-badge-icon { width: 24px; height: 24px; fill: #FFD54F; }
        .speed-badge-text { color: #FFF; font-size: 1.6rem; font-weight: 800; font-family: sans-serif; }

        #countdown-box {
            position: fixed; top: 2vh; left: 50%; transform: translateX(-50%);
            font-size: 18rem; font-family: 'Arial Black', Impact, sans-serif; font-weight: 900; 
            color: rgba(200, 200, 200, 0.75); text-shadow: 4px 4px 10px rgba(0,0,0,0.5);
            display: none; z-index: 10001; line-height: 1; margin: 0; padding: 0;
        }
        body.show-countdown #countdown-box { display: block; }
        body.hide-kanji-answer #kanji-choices-area .highlight-gold { color: #FFFFFF !important; }
        /* === ここまで追加 === */
    </style>
</head>
<body data-speaker="1">
    <video autoplay muted loop id="background-video"><source src="" type="video/mp4"></video>
    <img id="background-image" src="" alt="Background Image">
    
    <div id="countdown-box"></div>
    
    <div id="speed-badge-container">
        <svg class="speed-badge-icon" viewBox="0 0 24 24">
            <path d="M3 9v6h4l5 5V4L7 9H3zm13.5 3c0-1.77-1.02-3.29-2.5-4.03v8.05c1.48-.73 2.5-2.25 2.5-4.02zM14 3.23v2.06c2.89.86 5 3.54 5 6.71s-2.11 5.85-5 6.71v2.06c4.01-.91 7-4.49 7-8.77s-2.99-7.86-7-8.77z"/>
        </svg>
        <span id="speed-badge-text" class="speed-badge-text">1.0 speed</span>
    </div>

    <div class="container">
        <div id="quiz-screen" class="screen">
            
            <div id="kanji-badge-container">
                <div class="kanji-badge-item">★漢字テスト★</div>
            </div>
            
            <div id="scroll-list-panel">
                <div id="scroll-row-prev" class="scroll-row prev-style">
                    <div class="fit-box idle-box"><div id="scroll-prev-ja" class="scroll-ja"></div></div>
                </div>
                <div id="scroll-row-curr" class="scroll-row curr-style">
                    <div class="fit-box highlight-box"><div id="scroll-current-ja" class="scroll-ja"></div></div>
                    <div class="text-plate"><div id="scroll-current-romaji" class="scroll-ro"></div></div>
                </div>
                <div id="scroll-row-next" class="scroll-row next-style">
                    <div class="fit-box idle-box"><div id="scroll-next-ja" class="scroll-ja"></div></div>
                </div>
            </div>

            <div id="ex-detail-panel">
                <div class="fit-box highlight-box"><div id="ex-det-ja"></div></div>
                <div class="text-plate"><div id="ex-det-romaji"></div></div>
                <div class="text-plate"><div id="ex-det-en"></div></div>
            </div>

            <div id="ex-grammar-panel">
                <div id="ex-gram-ja" class="grammar-ja"></div>
                <div id="ex-gram-en" class="grammar-en"></div>
                <div id="ex-gram-explain" class="grammar-exp"></div>
            </div>

            <div id="transition-panel">
                <div class="transition-content">
                    <div id="trans-scene-num" class="transition-scene-num"></div>
                    <div id="trans-title" class="transition-title"></div>
                    <div id="trans-title-en" class="transition-title-en"></div>
                </div>
            </div>

            <div id="grammar2-panel">
                <div class="g2-top-section">
                    <div id="g2-grammar" class="g2-grammar-container"></div>
                </div>
                <div class="g2-bottom-section">
                    <div id="g2-sentence" class="g2-sentence-box"></div>
                </div>
            </div>

            <div id="speaker-icon-panel">
                <svg id="spk-icon-svg" class="speaker-icon-svg" viewBox="0 0 24 24">
                    <path d="M3 9v6h4l5 5V4L7 9H3zm13.5 3c0-1.77-1.02-3.29-2.5-4.03v8.05c1.48-.73 2.5-2.25 2.5-4.02zM14 3.23v2.06c2.89.86 5 3.54 5 6.71s-2.11 5.85-5 6.71v2.06c4.01-.91 7-4.49 7-8.77s-2.99-7.86-7-8.77z"/>
                </svg>
            </div>

            <div id="ja-text-only-panel">
                <div id="ja-only-text" class="ja-only-text"></div>
                <div id="ja-only-romaji" class="ja-only-romaji"></div>
            </div>

        </div>
    </div>

    <script>
    document.addEventListener('DOMContentLoaded', () => {
        window.visualUpdateStatus = 'IDLE'; 
        const videoElement = document.getElementById('background-video');
        const imageElement = document.getElementById('background-image');
        let backgroundAssets = [], globalIndexOffset = 0;
        let quizData = [], currentQuestionIndex = -1;

        function parseRuby(text) {
            if (!text) return '';
            let converted = text.replace(/(\\n|\n)/g, '<br>');
            converted = converted.replace(/([ぁ-ん])(?=[一-龠々〆ヵヶ])/g, '$1<wbr>');
            converted = converted.replace(/\{\{(.*?)\}\}/g, '<span class="highlight-gold">$1</span>');
            converted = converted.replace(/\[\[(.*?)\]\]/g, '<span class="highlight-red">$1</span>');
            converted = converted.replace(/([、。！？,.\?]+)/g, '$1<wbr>');
            converted = converted.replace(/([一-龠々〆ヵヶ\u2F00-\u2FDF\u3400-\u4DBF\uF900-\uFAFF]+)(?:[\(（])([^\)）]+)(?:[\)）])/g, '<ruby>$1<rt>$2</rt></ruby>');
            return converted;
        }

        function adjustToWidth(element, maxWidthPercent = 0.88) {
            if (!element) return;
            element.style.fontSize = ''; 
            const maxWidth = window.innerWidth * maxWidthPercent;
            let fontSize = parseFloat(window.getComputedStyle(element).fontSize);
            while (element.scrollWidth > maxWidth && fontSize > 8) {
                fontSize -= 1;
                element.style.fontSize = `${fontSize}px`;
            }
        }

        async function displayQuestion() {
            if (currentQuestionIndex < 0 || currentQuestionIndex >= quizData.length) return;
            document.body.classList.add('forced-hidden');
            document.body.classList.remove('mode-scroll-active', 'mode-ex-detail-active', 'mode-ex-grammar-active', 'mode-grammar2-active');
            const item = quizData[currentQuestionIndex]; 
            if (!item) return;
            document.body.setAttribute('data-speaker', item.speaker || "1");

            if (backgroundAssets.length > 0) {
                const assetIndex = (currentQuestionIndex + globalIndexOffset) % backgroundAssets.length;
                const nextAsset = backgroundAssets[assetIndex];
                const isVideo = nextAsset.match(/\.(mp4|mov|webm)$/i);
                if (isVideo) {

                        elGrammar.style.display = 'flex'; /* ★ grid から flex に変更 */

                        lines.forEach(line => {
                            // ★ 1. 記号(=, ↔, ≒)で左右に分割

                            if (match) {

                                const symbol = match[2].trim();

                                // 英数字や記号のみのカッコ（翻訳・補足）を安全に抽出する正規表現（ルビのひらがなを巻き込まない）
                                const bracketRegex = /^(.*?)\s*(\([a-zA-Z\s,.~'\"?\/\\#@\[\]\{\}\-_+=!|:;’“”〜~]+\))$/;

                                // ★ 2. 左側(日本語)の中にある「翻訳のカッコ ( )」を分離する
                                let leftMain = leftText;
                                let leftSub = '';
                                const leftMatch = leftText.match(bracketRegex);
                                if (leftMatch) {
                                    leftMain = leftMatch[1].trim();
                                    leftSub = leftMatch[2].trim();
                                }

                                // ★ 3. 右側(日本語・翻訳)の中にある「翻訳のカッコ ( )」を分離する（新設）
                                let rightMain = rightText;
                                let rightSub = '';
                                const rightMatch = rightText.match(bracketRegex);
                                if (rightMatch) {

                                    rightSub = rightMatch[2].trim();

                                    <div class="g2-part-right">

                                        ${rightSub ? `<div class="g2-part-right-sub">${rightSub}</div>` : ''}
                                    </div>

                            }

                    <span style="color:#FFF; font-size:12px;">文字の太さ</span>
                    <div>
                        <button id="btn-fw-500" style="padding:2px 6px; cursor:pointer; font-size:11px;">500</button>
                        <button id="btn-fw-600" style="padding:2px 6px; cursor:pointer; font-size:11px;">600</button>
                        <button id="btn-fw-700" style="padding:2px 6px; cursor:pointer; font-size:11px;">700</button>
                        <button id="btn-fw-800" style="padding:2px 6px; cursor:pointer; font-size:11px;">800</button>
                    </div>
                </div>
            </div>

            <div style="display:flex; gap:10px; margin-top:5px;">
                <button id="btn-prev" style="padding:6px; flex:1; cursor:pointer;">前へ</button>
                <button id="btn-next" style="padding:6px; flex:1; cursor:pointer;">次へ</button>
            </div>
        `;
        document.body.appendChild(toolDiv);

        const updateToolInfo = () => {
            const mode = previewModes[currentModeIndex];
            const elTop = document.getElementById(mode.topId);
            const elBot = mode.bottomId ? document.getElementById(mode.bottomId) : null;
            
            if(elTop) {
                if(mode.id === 'SHOW_SPEAKER_ICON') {
                    const w = Math.round(parseFloat(window.getComputedStyle(elTop).width));
                    document.getElementById('g-info').textContent = `サイズ: ${w}px`;
                } else {
                    const fz = Math.round(parseFloat(window.getComputedStyle(elTop).fontSize));
                    const mw = Math.round(parseFloat(window.getComputedStyle(elTop).maxWidth));
                    document.getElementById('g-info').textContent = `文字: ${fz}px | 横幅: ${mw}px`;
                }
            }
            if(elBot) {
                const fz = Math.round(parseFloat(window.getComputedStyle(elBot).fontSize));
                const mw = Math.round(parseFloat(window.getComputedStyle(elBot).maxWidth));
                document.getElementById('s-info').textContent = `文字: ${fz}px | 横幅: ${mw}px`;
            }
        };

        const changeStyle = (isTop, prop, delta) => {
            const mode = previewModes[currentModeIndex];
            const elId = isTop ? mode.topId : mode.bottomId;
            if(!elId) return;
            const el = document.getElementById(elId);
            if(!el) return;

            if(mode.id === 'SHOW_SPEAKER_ICON' && isTop) {
                let currentW = parseFloat(window.getComputedStyle(el).width);
                if(isNaN(currentW)) currentW = 150;
                el.style.width = (currentW + delta) + 'px';
                el.style.height = (currentW + delta) + 'px';
            } else {
                let currentVal = parseFloat(window.getComputedStyle(el)[prop]);
                if(isNaN(currentVal)) currentVal = prop === 'maxWidth' ? 1200 : 40; 
                el.style[prop] = (currentVal + delta) + 'px';
            }
            updateToolInfo();
        };

        document.getElementById('btn-toggle-mode').onclick = () => {
            currentModeIndex = (currentModeIndex + 1) % previewModes.length;
            const mode = previewModes[currentModeIndex];
            
            document.getElementById('tool-title').textContent = `${mode.name} 調整`;
            document.getElementById('label-top-box').textContent = mode.topLabel;
            
            document.getElementById('top-width-control').style.display = (mode.id === 'SHOW_SPEAKER_ICON') ? 'none' : 'flex';
            
            // 下段コントロールを有効化
            document.getElementById('bottom-control-area').style.display = mode.bottomId ? 'block' : 'none';
            if (mode.bottomLabel) {
                document.getElementById('label-bottom-box').textContent = mode.bottomLabel;
            }
            
            // 文法解説画面のときだけ透明度コントロールを表示
            document.getElementById('bg-opacity-control-area').style.display = (mode.id === 'SHOW_EX_GRAMMAR') ? 'block' : 'none';
            
            showPreview();
        };

        let currentGrammarBgOpacity = 0.85; // 初期値
        document.getElementById('btn-bg-op-minus').onclick = () => {
            currentGrammarBgOpacity = Math.max(0, currentGrammarBgOpacity - 0.05);
            document.getElementById('ex-grammar-panel').style.backgroundColor = `rgba(0, 0, 0, ${currentGrammarBgOpacity.toFixed(2)})`;
        };
        document.getElementById('btn-bg-op-plus').onclick = () => {
            currentGrammarBgOpacity = Math.min(1, currentGrammarBgOpacity + 0.05);
            document.getElementById('ex-grammar-panel').style.backgroundColor = `rgba(0, 0, 0, ${currentGrammarBgOpacity.toFixed(2)})`;
        };

        // フォント・太さ切り替えロジック
        document.getElementById('btn-font-klee').onclick = () => { document.body.style.fontFamily = "'Klee One', 'Yu Mincho', serif"; };
        document.getElementById('btn-font-noto').onclick = () => { document.body.style.fontFamily = "'Noto Sans JP', sans-serif"; };
        ['500', '600', '700', '800'].forEach(w => {
            document.getElementById(`btn-fw-${w}`).onclick = () => {
                let fwStyleNode = document.getElementById('fw-test-style');
                if (!fwStyleNode) {
                    fwStyleNode = document.createElement('style');
                    fwStyleNode.id = 'fw-test-style';
                    document.head.appendChild(fwStyleNode);
                }
                // ルビが潰れないよう、ルビだけベースより一段階細くする配慮
                const rubyWeight = Math.max(400, parseInt(w) - 100);
                fwStyleNode.innerHTML = `body, div, span { font-weight: ${w} !important; } rt { font-weight: ${rubyWeight} !important; }`;
            };
        });

        document.getElementById('btn-g-s-minus').onclick = () => changeStyle(true, 'fontSize', -4); 
        document.getElementById('btn-g-s-plus').onclick = () => changeStyle(true, 'fontSize', 4);
        document.getElementById('btn-g-w-minus').onclick = () => changeStyle(true, 'maxWidth', -20);
        document.getElementById('btn-g-w-plus').onclick = () => changeStyle(true, 'maxWidth', 20);

        document.getElementById('btn-s-s-minus').onclick = () => changeStyle(false, 'fontSize', -2);
        document.getElementById('btn-s-s-plus').onclick = () => changeStyle(false, 'fontSize', 2);
        document.getElementById('btn-s-w-minus').onclick = () => changeStyle(false, 'maxWidth', -20);
        document.getElementById('btn-s-w-plus').onclick = () => changeStyle(false, 'maxWidth', 20);

        const showPreview = async () => {
            await displayQuestion();
            
            // ★プレビュー表示時は、同フォルダ内の「002.png」を背景画像として強制上書き設定
            const imgEl = document.getElementById('background-image');
            const vidEl = document.getElementById('background-video');
            if (imgEl && vidEl) {
                vidEl.style.display = 'none';
                imgEl.style.display = 'block';
                imgEl.src = '002.png';
            }
            
            window.executeVisualAction(previewModes[currentModeIndex].id);
            setTimeout(updateToolInfo, 100); 
        };

        document.getElementById('btn-prev').onclick = () => { if (currentQuestionIndex > 0) { currentQuestionIndex--; showPreview(); } };
        document.getElementById('btn-next').onclick = () => { if (currentQuestionIndex < quizData.length - 1) { currentQuestionIndex++; showPreview(); } };

        window.addEventListener('dragover', (e) => { e.preventDefault(); e.dataTransfer.dropEffect = 'copy'; });
        window.addEventListener('drop', (e) => {
            e.preventDefault();
            const file = e.dataTransfer.files[0];
            if (file && (file.type === "application/json" || file.name.endsWith('.json'))) {
                const reader = new FileReader();
                reader.onload = (event) => {
                    try {
                        window.initializeQuiz({ quizData: JSON.parse(event.target.result) });
                        toolDiv.style.display = 'flex'; 
                        currentQuestionIndex = 0; 
                        showPreview();
                    } catch (err) { alert("JSONの読み込みに失敗しました: " + err.message); }
                };
                reader.readAsText(file);
            }
        });
    });
    </script>
</body>
</html>
